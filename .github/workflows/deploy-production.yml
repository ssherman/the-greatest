name: Deploy to Production

on:
  workflow_dispatch:
  repository_dispatch:
    types: [image-built-event]

# The job reaches the server over SSH only and never uses GITHUB_TOKEN.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Without this, an unset secret renders as "" and the SSH action skips the
      # host-key check silently. This makes a missing secret fail the deploy, and
      # its success in the log is the evidence that the check ran.
      - name: Require the host-key fingerprint
        env:
          FINGERPRINT: ${{ secrets.SERVER_SSH_HOST_FINGERPRINT }}
        run: test -n "$FINGERPRINT" || { echo "::error::SERVER_SSH_HOST_FINGERPRINT is not set"; exit 1; }

      - name: Deploy application
        # master as of 2026-09-30, pinned to a commit, which fixes the action's
        # code. It still downloads the drone-ssh binary from appleboy's release
        # and checks it against that release's checksums file (catches
        # corruption, not a replaced release). The v1.2.5 tag predates even that.
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327
        env:
          AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        with:
          host: ${{ secrets.SERVER_WEB_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # SHA256 fingerprint of the server's ECDSA host key. A mismatch fails
          # the connect and deploys nothing. After a server rebuild, update it:
          # deployment/SERVER-UPGRADE-GUIDE.md.
          fingerprint: ${{ secrets.SERVER_SSH_HOST_FINGERPRINT }}
          envs: AGE_PRIVATE_KEY
          script: |
            set -e
            cd /home/deploy/apps/the-greatest

            # Clean up Docker resources
            docker system prune -f

            # Pull latest code (includes encrypted secrets)
            git pull

            # Remove any age key an earlier version of this script left on
            # disk when its decrypt step failed before its cleanup ran.
            rm -f ~/.config/sops/age/keys.txt

            # Decrypt secrets to .env. sops reads the age key from the
            # environment, so the key is never written to disk.
            (umask 077; SOPS_AGE_KEY="$AGE_PRIVATE_KEY" sops -d secrets/.env.production > .env.new)
            mv .env.new .env
            chmod 600 .env
            unset AGE_PRIVATE_KEY

            # Pull web/worker images and rebuild nginx
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml build --no-cache nginx
            docker compose -f docker-compose.prod.yml up -d

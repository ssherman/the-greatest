name: CI

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: web-app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          working-directory: web-app
          bundler-cache: true

      - name: Lint code for consistent style
        run: bundle exec standardrb --format github

# The nightly restore check's cluster (docs/features/home-server.md). The production server's config file
# lives outside its data directory too, so a restored backup does not carry it: this is the VM's own, kept to
# what a restore, the checks and a dump need. archive_mode, max_logical_replication_workers, ssl and
# listen_addresses are also forced on the command line in compose.pgverify.yml, which wins over this file
# and over the restored postgresql.auto.conf.
listen_addresses = ''
unix_socket_directories = '/var/run/postgresql'
port = 5432
max_connections = 20

# Recovery only has to replay WAL, not serve queries. With hot_standby on, recovery refuses to proceed
# when max_connections or max_worker_processes is below the production server's (200 and 8 or more).
hot_standby = off
wal_level = replica

# The VM has 8 GB. Production uses 2GB; this is half of it.
shared_buffers = 1GB
maintenance_work_mem = 512MB
work_mem = 16MB
max_wal_size = 4GB

# Nothing leaves this server.
archive_mode = off
max_wal_senders = 0
max_logical_replication_workers = 0
ssl = off

log_min_messages = warning

# The `ol` VM's production settings (docs/features/home-server.md), merged over
# data-sources/docker-compose.yml by guest/compose.sh. Sized for a 16 GB,
# 12-vCPU, 24 GB VM: 6 GB for the API's DuckDB, 8 GB for a running build, the
# rest is page cache over the artifact.
services:
  api:
    environment:
      OL_API_MEMORY_LIMIT: 6GB
  build:
    # The live API keeps 2 of the 12 vCPUs while a build runs.
    cpus: 10
    # --threads 4: DuckDB's list aggregates (year_evidence) hold per-thread
    # state outside --memory-limit and cannot spill. The first build ran 8
    # threads and was OOM-killed at 15.8 GB RSS. guest/ol-refresh.sh also
    # puts a 16 GB swap file on the data disk as a backstop.
    command: [python, -m, openlibrary.pipeline.build, --root, /data, --memory-limit, 8GB, --threads, "4"]

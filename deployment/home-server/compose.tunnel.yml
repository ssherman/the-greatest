# The Cloudflare Tunnel connector for whichever service this VM runs
# (docs/features/home-server.md). The routing (hostname -> http://openlibrary:8080
# or http://page-fetcher:8081) lives in the tunnel's dashboard configuration, so
# this file is the same on both VMs. The two aliases below give the services
# those stable names while they keep their compose names (api, fetcher). Profile "tunnel" is on only after
# `provision --enable-tunnels`, which runs once Cloudflare Access is in place.
services:
  api:
    networks:
      default:
        aliases: [openlibrary]
  fetcher:
    networks:
      default:
        aliases: [page-fetcher]
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"

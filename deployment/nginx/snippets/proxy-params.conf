# $host is the matched server name without any client-supplied :port (Rails also
# admits only config.domains; see web-app/config/initializers/host_authorization.rb).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Rails would otherwise believe a client's own Forwarded header over X-Forwarded-For.
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_buffering off;

# Hide security headers from upstream Rails app to prevent conflicts
proxy_hide_header x-frame-options;
proxy_hide_header content-security-policy;
proxy_hide_header x-content-type-options;
proxy_hide_header strict-transport-security;

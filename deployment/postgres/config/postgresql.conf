# deployment/postgres/config/postgresql.conf -- the whole server configuration; postgresql.auto.conf stays empty.
# Spec: docs/superpowers/specs/2026-11-06-postgres-server-design.md §6. Sized for 8 GB, 4 cores.
listen_addresses = '*'
port = 5432
max_connections = 200

# Memory
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 5242kB
maintenance_work_mem = 512MB
wal_buffers = 16MB

# Planner and I/O (io_method stays at its default; io_uring needs a seccomp change)
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Parallelism. max_worker_processes leaves room for the logical replication subscription.
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# WAL and checkpoints
wal_level = replica
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# Archiving: at most about 5 minutes of writes lost if the server is destroyed.
# pgBackRest finds its config through PGBACKREST_CONFIG (compose.yml).
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'
archive_timeout = 300

# Encryption: self-signed certificate from bin/generate-certs.sh.
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_cert_file = '/etc/postgresql-certs/server.pem'
ssl_key_file = '/etc/postgresql-certs/server-key.pem'

# Logging goes to stderr and Docker's rotation (100m x 20 files).
log_connections = on
log_disconnections = on
log_min_duration_statement = 1000
log_lock_waits = on
track_io_timing = on

shared_preload_libraries = 'pg_stat_statements'

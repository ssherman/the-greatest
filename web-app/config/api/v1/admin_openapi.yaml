openapi: 3.1.0
info:
  title: The Greatest API (admin)
  version: "1"
  description: |
    Administrative operations on The Greatest Books catalogue. Every endpoint needs a
    bearer token carrying a `books:admin:*` scope, which only an administrator or a
    books domain role holder can be issued, and which always expires. This document
    is served only to such tokens.
servers:
  - url: https://thegreatestbooks.org
security:
  - bearerAuth: []
paths:
  /api/v1/admin/openapi.json:
    x-domain: books
    get:
      operationId: getAdminOpenapi
      security: [{bearerAuth: ["books:admin:read"]}]
      summary: This document
      description: Requires `books:admin:read`.
      responses:
        "200":
          description: The admin OpenAPI 3.1 document as JSON, with `servers` set to the host it was fetched from.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/books:
    x-domain: books
    get:
      operationId: searchAdminBooks
      security: [{bearerAuth: ["books:admin:read"]}]
      summary: Search books
      description: Full-text search over titles, subtitles and author names. Unlike the public API this includes provisional (unreviewed import) books and every book kind. Requires `books:admin:read`. At most the first 1000 matches are paged.
      x-mcp:
        description: >-
          Searches every book by title, subtitle or author name, including provisional (unreviewed import)
          books that the public site hides; `q` is required. Use it to find the integer `id` that merge_book
          and tag_book take, because every admin write takes ids, not slugs. To find an author use
          search_admin_authors.
      parameters:
        - name: q
          in: query
          required: true
          description: The search text. Blank is a 400.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of matching books, best match first.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBookCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/authors:
    x-domain: books
    get:
      operationId: searchAdminAuthors
      security: [{bearerAuth: ["books:admin:read"]}]
      summary: Search authors
      description: Full-text search over author names, including provisional authors. Requires `books:admin:read`. At most the first 1000 matches are paged.
      x-mcp:
        description: >-
          Searches authors by name, including provisional authors; `q` is required. Use it to find the integer
          `id` that merge_author and tag_author take, because every admin write takes ids, not slugs. To find
          a book use search_admin_books.
      parameters:
        - name: q
          in: query
          required: true
          description: The search text. Blank is a 400.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of matching authors, best match first.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthorCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/duplicate_candidates:
    x-domain: books
    get:
      operationId: listDuplicateCandidates
      security: [{bearerAuth: ["books:admin:read"]}]
      summary: List suspected duplicate pairs
      description: |
        The duplicate review queue for books and authors, newest first. Pending pairs by default; `status` selects merged or not_duplicate (dismissed) pairs and `item_type` narrows to books or authors. Each pair carries both records (`records`, lower id first) with the evidence the admin queue page shows. A record a merge or delete has since removed is `{id, missing: true}`. Requires `books:admin:read`.
      x-mcp:
        description: >-
          Lists suspected duplicate pairs of books and authors, newest first; pending pairs by default, and
          `status` also accepts merged or not_duplicate. `item_type` narrows to book or author. Each pair has
          an integer `id`, why it was raised, and both records, ordered by id, with title, creators, year,
          ranked position, list count and identifiers; a record that no longer exists is `missing: true`. Use
          it to work through the queue; get_duplicate_candidate adds more detail for one pair.
          Resolving pairs shrinks the queue, so after merging or dismissing, list again from page 1 rather than
          continuing to a later page.
      parameters:
        - name: status
          in: query
          required: false
          description: "`pending` (default) is the open queue; `merged` and `not_duplicate` are resolved pairs."
          schema:
            type: string
            enum: [pending, merged, not_duplicate]
            default: pending
        - name: item_type
          in: query
          required: false
          description: Only pairs of this record type.
          schema:
            type: string
            enum: [book, author]
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of duplicate pairs.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDuplicateCandidateCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/duplicate_candidates/{id}:
    x-domain: books
    get:
      operationId: getDuplicateCandidate
      security: [{bearerAuth: ["books:admin:read"]}]
      summary: One suspected duplicate pair
      description: |
        One pair in any status, with more detail on each record (description, alternate titles or names, the lists a book is on or an author's books) and the match decision that raised it, if any. A pair that does not exist, or was folded into another pair by a merge, is 404. Requires `books:admin:read`.
      x-mcp:
        description: >-
          Returns one duplicate pair by integer id, in any status, with both records ordered by id and more
          detail on each: description, alternate titles (books) or names (authors), up to 25 lists a book is
          on or up to 25 of an author's books, and the match decision that raised the pair. A 404 means the
          pair is gone, possibly folded into another pair by a merge; call list_duplicate_candidates again.
          Ids come from list_duplicate_candidates.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The pair.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDuplicateCandidateDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/duplicate_candidates/{id}/merge:
    x-domain: books
    post:
      operationId: mergeDuplicateCandidate
      security: [{bearerAuth: ["books:admin:merge"]}]
      summary: Merge a suspected duplicate pair
      description: |
        Merges the pair: the record named by `target_id` survives and the one named by `source_id` is PERMANENTLY DELETED, as `merge_book` and `merge_author` do. The two ids must be exactly the pair's two record ids, as the get and list responses return them. The pair is marked merged, resolved by the token's owner via the API, with the optional `note`.
        Refused (422) when the pair is not pending, when `source_id` and `target_id` are not exactly the pair's two ids (a merge elsewhere can re-key a pair in place; get it again), or when one of the pair's records no longer exists. A 404 means no such pair, or one folded into another by a merge.
        Send `dry_run: true` to validate and see both records without changing anything. Requires `books:admin:merge`, and the token's owner must be allowed to delete both records. There is no undelete.
      x-mcp:
        description: >-
          Merges the pair: `target_id` survives and `source_id` is PERMANENTLY DELETED, with no undelete. Pass
          the pair's two record ids exactly as `get_duplicate_candidate` or `list_duplicate_candidates`
          returned them. `dry_run: true` validates without changing anything. `note` is
          optional and shown to admins reviewing the queue. A 422 saying the records are
          not this pair's, or a 404, means another merge changed the queue: list it again. After the real merge, report its
          `warnings`: they name follow-up work (search reindexing, ranking recalculation) that will need to be
          re-run, and for a book pair the authors or credits that did not transfer.
        destructive: true
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateMergeRequest"
      responses:
        "200":
          description: The merge was done (or, for a dry run, would succeed). `pair` is the pair as it now stands; on a dry run it is unchanged.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDuplicateMerge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/duplicate_candidates/{id}/dismiss:
    x-domain: books
    post:
      operationId: dismissDuplicateCandidate
      security: [{bearerAuth: ["books:admin:write"]}]
      summary: Dismiss a suspected duplicate pair
      description: |
        Marks the pair as not duplicates, resolved by the token's owner via the API, with the optional `note`. Nothing is deleted. Works even when one of the pair's records no longer exists. Send `record_ids`, the pair's two record ids as the get and list responses return them. Refused (422) when the pair is not pending or when `record_ids` are not exactly the pair's ids (a merge elsewhere can re-key a pair in place). Requires `books:admin:write`, and the token's owner must be allowed to change books (or authors, for an author pair).
      x-mcp:
        description: >-
          Marks the pair as not duplicates. `note` is optional and shown to admins. Nothing is deleted, and it
          works even when one record of the pair no longer exists. Pass `record_ids`, the pair's two record ids
          exactly as `get_duplicate_candidate` or `list_duplicate_candidates` returned them. A 422 saying the
          pair is already resolved or the records changed, or a 404, means the queue changed: list it again.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateDismissRequest"
      responses:
        "200":
          description: The pair, now marked not_duplicate.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDuplicateDismiss"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/match_decisions:
    x-domain: books
    get:
      operationId: listMatchDecisions
      security: [{bearerAuth: ["books:admin:read"]}]
      summary: List match decisions
      description: |
        The match-decision review queue for books: the decisions the book, author, Wikidata and VIAF finders recorded, newest first. By default only decisions still needing review (`reviewed=pending`) and with verify runs hidden (`verify=hide`). Filter by `entity`, `outcome`, `confidence`, `decided_by`, `reviewed` and `verify`. Each row names its subject and record and, once reviewed, who reviewed it and how. Requires `books:admin:read`.
      x-mcp:
        description: >-
          Lists match decisions from the books review queue, newest first. By default only decisions that still
          need review and are not yet reviewed, with verify runs hidden; `reviewed` also accepts reviewed or all,
          and `verify` accepts include. `entity` is one of book, author, wikidata-link or viaf-link. `outcome` is
          matched or unmatched; `confidence` is certain, high, medium or low; `decided_by` is identifier, rule, ai
          or fallback. Each row has an integer `id`, the finder's outcome, confidence and reason, the `subject`
          (the record being resolved) and `record` (the record it linked or created) with id, type and label, and
          a `review` block once someone reviewed it. Reviewing shrinks the queue, so after reviewing decisions
          list again from page 1 rather than continuing to a later page. get_match_decision adds the query and
          the candidates for one decision.
      parameters:
        - name: entity
          in: query
          required: false
          description: Only decisions of this finder.
          schema:
            type: string
            enum: [book, author, wikidata-link, viaf-link]
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [matched, unmatched]
        - name: confidence
          in: query
          required: false
          schema:
            type: string
            enum: [certain, high, medium, low]
        - name: decided_by
          in: query
          required: false
          schema:
            type: string
            enum: [identifier, rule, ai, fallback]
        - name: reviewed
          in: query
          required: false
          description: "`pending` (default) is the open queue: needing review and not yet reviewed. `reviewed` is the decisions a person has reviewed; `all` is both."
          schema:
            type: string
            enum: [pending, reviewed, all]
            default: pending
        - name: verify
          in: query
          required: false
          description: "`hide` (default) leaves out verify runs, one per ranked book, which would bury the imports. `include` shows them."
          schema:
            type: string
            enum: [hide, include]
            default: hide
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of match decisions.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMatchDecisionCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/match_decisions/{id}:
    x-domain: books
    get:
      operationId: getMatchDecision
      security: [{bearerAuth: ["books:admin:read"]}]
      summary: One match decision
      description: |
        One books match decision by id, reviewed or not, with the query the finder was given, the index of the candidate it chose (counting from one) and every candidate snapshot. Each candidate carries `current`, the live summary of the local record it names, or null when it names no local record or the record has since been merged or deleted. A decision that does not exist, or belongs to another site, is 404. Requires `books:admin:read`.
      x-mcp:
        description: >-
          Returns one match decision by integer id, reviewed or not: the finder, outcome, confidence and reason,
          the `query` the finder was given, `selected_index` (which candidate it chose, counting from one; null when
          none) and every `candidates` snapshot with its sources, scores and evidence. Each candidate's `current` is
          the record's live summary (title, creators, year, ranked position, list count, identifiers), or null when
          the candidate names no local record or the record was merged or deleted. A 404 means no such decision in
          the books queue; call list_match_decisions again. Ids come from list_match_decisions.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The match decision.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMatchDecisionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/match_decisions/{id}/review:
    x-domain: books
    post:
      operationId: reviewMatchDecision
      security: [{bearerAuth: ["books:admin:write"]}]
      summary: Review a match decision
      description: |
        Marks the decision reviewed by the token's owner via the API, with an optional `verdict` (`confirmed` or `rejected`) and `note`. Refused (422) when the decision is already reviewed, and when `verdict` is `rejected` on a matched Wikidata or VIAF link decision: use the reject-link operation, which also removes the identifier. Requires `books:admin:write`, and the token's owner must be allowed to change books.
      x-mcp:
        description: >-
          Marks a match decision reviewed, which takes it out of the pending queue. `verdict` is optional:
          confirmed (the finder was right) or rejected (it was wrong); `note` is optional and shown to admins.
          A decision that is already reviewed is a 422, as is verdict rejected on a matched Wikidata or VIAF
          link decision; use reject_match_decision_link for those. Returns the decision with its detail.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchDecisionReviewRequest"
      responses:
        "200":
          description: The decision, now reviewed.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMatchDecisionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/match_decisions/{id}/reject_link:
    x-domain: books
    post:
      operationId: rejectMatchDecisionLink
      security: [{bearerAuth: ["books:admin:merge"]}]
      summary: Reject a Wikidata or VIAF link (permanent)
      description: |
        Says a matched Wikidata or VIAF record is not this author. PERMANENTLY removes the identifier that record wrote (and a superseded one kept beside it), reverts the facts the link's runs applied, reverts and deprecates AI results that used it, marks this decision and every decision of the same record rejected and reviewed, and runs the author's Wikidata step again. The same decisions a person rejects on the admin page. `note` is appended to the decision's review note. Refused (422) for decisions that are not matched Wikidata or VIAF links and for one already rejected. Requires `books:admin:merge`, and the token's owner must be allowed to delete authors.
      x-mcp:
        destructive: true
        description: >-
          Rejects a matched Wikidata or VIAF link as the wrong person. This permanently deletes the author's
          identifier from that record, reverts the facts it wrote, rejects every decision of the same record
          and starts the author's enrichment again; it cannot be undone. `note` is optional. Returns the
          decision, the ids of every decision rejected with it, and what was reverted. A 422 means the decision
          is not a matched Wikidata or VIAF link, or was already rejected.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:

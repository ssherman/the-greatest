  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A personal access token (`tg_…`). Create one at /developers/tokens.
  parameters:
    page:
      name: page
      in: query
      description: 1-based page number. A page past the end returns an empty `data` array.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
        default: 1
    per_page:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    id:
      name: id
      in: path
      required: true
      description: The resource's integer id.
      schema:
        type: integer
        minimum: 1
    identifier_id:
      name: identifier_id
      in: path
      required: true
      description: The identifier row's integer id.
      schema:
        type: integer
        minimum: 1
    category_id:
      name: category_id
      in: path
      required: true
      description: The category's integer id.
      schema:
        type: integer
        minimum: 1
  headers:
    X-RateLimit-Limit:
      description: Requests allowed per calendar minute.
      schema: {type: integer}
    X-RateLimit-Remaining:
      description: Requests left in the current minute.
      schema: {type: integer}
    X-RateLimit-Reset:
      description: Unix time at which the minute window resets.
      schema: {type: integer}
    X-RateLimit-Daily-Limit:
      description: Requests allowed per UTC day.
      schema: {type: integer}
    X-RateLimit-Daily-Remaining:
      description: Requests left today.
      schema: {type: integer}
    X-RateLimit-Daily-Reset:
      description: Unix time of the next 00:00 UTC.
      schema: {type: integer}
    Retry-After:
      description: Seconds until the exhausted window resets.
      schema: {type: integer}
    WWW-Authenticate:
      description: RFC 6750 challenge.
      schema: {type: string}
  responses:
    BadRequest:
      description: A query parameter or body field is malformed or out of range.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Daily-Limit:
          $ref: "#/components/headers/X-RateLimit-Daily-Limit"
        X-RateLimit-Daily-Remaining:
          $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
        X-RateLimit-Daily-Reset:
          $ref: "#/components/headers/X-RateLimit-Daily-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No token, or a token that is malformed, unknown, revoked or expired.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWW-Authenticate"
          required: true
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The token lacks the admin scope this endpoint needs, or its owner no longer qualifies for it (`insufficient_scope`); or, on a merge or a tag change, the owner may not change one of the records (`forbidden`).
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWW-Authenticate"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No record at that address (unknown slug or id).
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Daily-Limit:
          $ref: "#/components/headers/X-RateLimit-Daily-Limit"
        X-RateLimit-Daily-Remaining:
          $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
        X-RateLimit-Daily-Reset:
          $ref: "#/components/headers/X-RateLimit-Daily-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: The request was understood but is not allowed or failed (`unprocessable`), for example merging a record into itself, or giving a category a name another one already uses.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Daily-Limit:
          $ref: "#/components/headers/X-RateLimit-Daily-Limit"
        X-RateLimit-Daily-Remaining:
          $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
        X-RateLimit-Daily-Reset:
          $ref: "#/components/headers/X-RateLimit-Daily-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: A rate-limit window is exhausted. `Retry-After` says when it resets.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
          required: true
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      description: RFC 9457 Problem Details with a stable `code`.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum: [unauthenticated, invalid_token, membership_required, insufficient_scope, forbidden, not_found, invalid_parameter, unprocessable, rate_limited]
        detail:
          type: string
        merged:
          description: Category merge only, on a 422 that came part way. Ids already merged; they stay merged.
          type: array
          items: {type: integer}
        failed:
          description: Category merge only, on a 422 that came part way. The source that failed.
          type: object
          required: [id, message]
          properties:
            id: {type: integer}
            message: {type: string}
        not_attempted:
          description: Category merge only, on a 422 that came part way. Ids never tried.
          type: array
          items: {type: integer}
        post_commit_errors:
          description: Category merge only. Sources listed in `merged` whose follow-up work raised after the merge committed.
          type: array
          items:
            type: object
            required: [id, message]
            properties:
              id: {type: integer}
              message: {type: string}
    PaginationMeta:
      type: object
      required: [page, per_page, total_count, total_pages]
      properties:
        page: {type: integer, minimum: 1}
        per_page: {type: integer, minimum: 1, maximum: 100}
        total_count: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 1}
    PaginationLinks:
      type: object
      required: [self, next, prev, first, last]
      properties:
        self: {type: string, format: uri}
        next: {type: [string, "null"], format: uri}
        prev: {type: [string, "null"], format: uri}
        first: {type: string, format: uri}
        last: {type: string, format: uri}
    AuthorSummary:
      type: object
      required: [id, slug, name]
      properties:
        id: {type: integer}
        slug: {type: string}
        name: {type: string}
    AdminBook:
      type: object
      required: [id, slug, title, subtitle, book_kind, provisional, first_published_year, rank, authors]
      properties:
        id: {type: integer}
        slug: {type: string}
        title: {type: string}
        subtitle: {type: [string, "null"]}
        book_kind:
          type: string
          enum: [standalone, collection]
        provisional: {type: boolean, description: An unreviewed import, absent from the public catalogue.}
        first_published_year: {type: [integer, "null"]}
        rank:
          type: [integer, "null"]
          description: Position in the site's primary ranking; null when unranked.
        authors:
          type: array
          items:
            $ref: "#/components/schemas/AuthorSummary"
    AdminAuthor:
      type: object
      required: [id, slug, name, kind, provisional, birth_year, death_year, rank, book_count]
      properties:
        id: {type: integer}
        slug: {type: string}
        name: {type: string}
        kind:
          type: string
          enum: [person, organization, pseudonym, collective]
        provisional: {type: boolean}
        birth_year: {type: [integer, "null"]}
        death_year: {type: [integer, "null"]}
        rank:
          type: [integer, "null"]
          description: Position in the site's primary author ranking; null when unranked.
        book_count: {type: integer, minimum: 0, description: Books credited to this author, provisional included.}
    CategoryRef:
      type: object
      required: [id, slug, name]
      properties:
        id: {type: integer}
        slug: {type: [string, "null"]}
        name: {type: string}
    AdminCategory:
      type: object
      required: [id, slug, name, category_type, description, parent, book_count, alternative_names, deleted, merged_into, item_count, book_link_count, author_link_count, children_count, import_source, created_at, updated_at]
      properties:
        id: {type: integer}
        slug: {type: [string, "null"]}
        name: {type: string}
        category_type:
          type: string
          enum: [genre, location, subject, theme, audience]
        description: {type: [string, "null"]}
        parent:
          description: The raw parent, even when it is deleted or merged.
          oneOf:
            - {type: "null"}
            - $ref: "#/components/schemas/CategoryRef"
        book_count: {type: integer, minimum: 0, description: Books in the site's primary ranking that carry this category.}
        alternative_names:
          type: array
          items: {type: string}
        deleted: {type: boolean, description: True for a soft-deleted category and for one merged into another.}
        merged_into:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: {type: integer}
            name: {type: string}
        item_count: {type: integer, minimum: 0, description: The catalog counter cache, all item types.}
        book_link_count: {type: integer, minimum: 0, description: Books carrying the category, any source.}
        author_link_count: {type: integer, minimum: 0, description: Authors carrying the category, any source.}
        children_count: {type: integer, minimum: 0}
        import_source:
          type: [string, "null"]
          enum: [amazon, open_library, openai, goodreads, musicbrainz, igdb, null]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminCategoryFull:
      allOf:
        - $ref: "#/components/schemas/AdminCategory"
        - type: object
          required: [children, ancestors]
          properties:
            children:
              type: array
              items:
                $ref: "#/components/schemas/CategoryRef"
            ancestors:
              type: array
              description: A location's parents, root first. Empty for every other type.
              items:
                $ref: "#/components/schemas/CategoryRef"
    AdminCategoryDetail:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminCategoryFull"
    AdminCategoryCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminCategory"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    DuplicateCandidateRecord:
      type: object
      description: One side of a pair. A record that has been merged away or deleted is only `id` and `missing`. A present record carries the finder summary plus type-specific fields (book_kind and alternate_titles for books; alternate_names, birth_year, death_year, kind and book_titles for authors) and, on the single-pair endpoint, the detail fields.
      required: [id, missing]
      properties:
        id: {type: integer}
        missing: {type: boolean}
        title: {type: string, description: The book title or the author name.}
        creators:
          type: array
          items: {type: string}
        year: {type: [integer, "null"]}
        ranked_position: {type: [integer, "null"]}
        list_count: {type: integer, minimum: 0}
        identifiers:
          type: array
          items:
            type: object
            required: [type, value]
            properties:
              type: {type: string}
              value: {type: string}
        subtitle: {type: [string, "null"]}
        alternate_titles:
          type: array
          items: {type: string}
        alternate_names:
          type: array
          items: {type: string}
        description: {type: [string, "null"], description: "The first 500 characters (detail only)."}
        lists:
          type: array
          description: Up to 25 lists the book is on (books, detail only).
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: integer}
              name: {type: string}
        books:
          type: array
          description: Up to 25 of the author's books (authors, detail only).
          items:
            type: object
            required: [id, title, rank]
            properties:
              id: {type: integer}
              title: {type: string}
              rank: {type: [integer, "null"]}
    AdminDuplicateCandidate:
      type: object
      required: [id, item_type, raised_by, status, occurrences, evidence, created_at, resolution, records]
      properties:
        id: {type: integer}
        item_type:
          type: string
          enum: [book, author]
        raised_by:
          type: string
          enum: [identifier_collision, external_key_collision, ai, human, bulk_verify, ol_backfill]
        status:
          type: string
          enum: [pending, merged, not_duplicate]
        occurrences: {type: integer, minimum: 1}
        evidence:
          type: object
          description: Why the pair was raised; free-form.
        created_at: {type: string, format: date-time}
        resolution:
          description: Null while the pair is pending.
          oneOf:
            - {type: "null"}
            - type: object
              required: [resolved_at, resolved_by, resolved_via, note]
              properties:
                resolved_at: {type: [string, "null"], format: date-time}
                resolved_by: {type: [string, "null"], description: The resolving user's email.}
                resolved_via:
                  type: [string, "null"]
                  enum: [admin_ui, api, null]
                note: {type: [string, "null"]}
        records:
          type: array
          description: Both records, lower id first.
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/DuplicateCandidateRecord"
    AdminDuplicateCandidateFull:
      allOf:
        - $ref: "#/components/schemas/AdminDuplicateCandidate"
        - type: object
          required: [match_decision]
          properties:
            match_decision:
              description: The finder decision that raised the pair, if any.
              oneOf:
                - {type: "null"}
                - type: object
                  required: [id, finder, outcome, confidence, reason]
                  properties:
                    id: {type: integer}
                    finder: {type: string}
                    outcome: {type: string, enum: [matched, unmatched]}
                    confidence: {type: string, enum: [certain, high, medium, low]}
                    reason: {type: [string, "null"]}
    AdminDuplicateCandidateDetail:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminDuplicateCandidateFull"
    MatchDecisionReference:
      description: A record a decision names. Null when the decision names none.
      oneOf:
        - {type: "null"}
        - type: object
          required: [id, type, label]
          properties:
            id: {type: integer}
            type: {type: string, description: "The record's class, e.g. Books::Book."}
            label: {type: [string, "null"], description: The book or edition title or the author name; null for a record with neither (a list item).}
    AdminMatchDecision:
      type: object
      required: [id, entity, finder, outcome, confidence, decided_by, reason, created_at, subject, record, review]
      properties:
        id: {type: integer}
        entity:
          type: string
          description: The finder's kind.
          enum: [book, author, wikidata-link, viaf-link]
        finder: {type: string}
        outcome: {type: string, enum: [matched, unmatched]}
        confidence: {type: string, enum: [certain, high, medium, low]}
        decided_by: {type: string, enum: [identifier, rule, ai, fallback]}
        reason: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        subject:
          $ref: "#/components/schemas/MatchDecisionReference"
        record:
          $ref: "#/components/schemas/MatchDecisionReference"
        review:
          description: Null until the decision is reviewed.
          oneOf:
            - {type: "null"}
            - type: object
              required: [reviewed_at, reviewed_by, reviewed_via, note, verdict]
              properties:
                reviewed_at: {type: string, format: date-time}
                reviewed_by: {type: [string, "null"], description: The reviewer's email.}
                reviewed_via:
                  type: [string, "null"]
                  enum: [admin_ui, api, null]
                note: {type: [string, "null"]}
                verdict: {type: [string, "null"], enum: [confirmed, rejected, null]}
    AdminMatchDecisionFull:
      allOf:
        - $ref: "#/components/schemas/AdminMatchDecision"
        - type: object
          required: [query, selected_index, candidates]
          properties:
            query:
              type: object
              description: The query the finder was given, as stored; free-form.
            selected_index:
              type: [integer, "null"]
              description: The chosen candidate, counting from one.
            candidates:
              type: array
              items:
                type: object
                description: A candidate snapshot as stored, plus `current`.
                required: [current]
                properties:
                  record_type: {type: [string, "null"]}
                  record_id: {type: [integer, "null"]}
                  external_key: {type: [string, "null"]}
                  external_source: {type: [string, "null"]}
                  sources:
                    type: array
                    items: {type: string}
                  scores:
                    type: object
                  evidence:
                    type: object
                  current:
                    description: The record's live summary (title, creators, year, ranked_position, list_count, identifiers); null when no local record.
                    type: [object, "null"]
    MatchDecisionReviewRequest:
      type: object
      properties:
        verdict:
          type: [string, "null"]
          enum: [confirmed, rejected, null]
          description: Optional. `rejected` is refused for a matched Wikidata or VIAF link decision (use reject-link).
        note:
          type: [string, "null"]
          maxLength: 1000
          description: Shown to admins reviewing the queue. Optional.
    MatchDecisionRejectLinkRequest:
      type: object
      properties:
        note:
          type: [string, "null"]
          maxLength: 1000
          description: Appended to the decision's review note. Optional.
    AdminMatchDecisionRejectLink:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [decision, rejected, reverted, descriptions_deprecated]
          properties:
            decision:
              $ref: "#/components/schemas/AdminMatchDecision"
            rejected:
              type: array
              description: Ids of every decision rejected, this one included.
              items: {type: integer}
            reverted:
              type: array
              description: The facts and identifiers removed from the author.
              items: {type: string}
            descriptions_deprecated:
              type: integer
    AdminMatchDecisionCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminMatchDecision"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    AdminMatchDecisionDetail:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminMatchDecisionFull"
    AdminIdentifier:
      type: object
      required: [id, identifier_type, value, source, created_at, edition]
      properties:
        id: {type: integer}
        identifier_type:
          type: string
          enum: [books_work_oclc_id, books_work_wikidata_qid, books_work_openlibrary_id, books_work_goodreads_id, books_work_librarything_id, books_work_isbn13, books_work_isbn10, books_work_asin, books_work_ean13, books_work_openlibrary_duplicate_id, books_edition_isbn13, books_edition_isbn10, books_edition_asin, books_edition_ean13, books_edition_oclc_number, books_edition_goodreads_id, books_edition_openlibrary_id, books_edition_google_id, books_edition_bookshop_org_id, books_author_viaf, books_author_isni, books_author_wikidata_qid, books_author_openlibrary_id, books_author_goodreads_id, books_author_librarything_id, books_author_lcnaf, books_series_goodreads_id]
        value: {type: string}
        source:
          type: [string, "null"]
          enum: [legacy, open_library, worldcat, goodreads_import, amazon, wikidata, viaf, goodreads, admin, null]
          description: Who attached the identifier; null when unrecorded.
        created_at: {type: string, format: date-time}
        edition:
          description: The edition holding the identifier; null when the book or author itself does.
          oneOf:
            - type: "null"
            - type: object
              required: [id, title, edition_type, publication_year]
              properties:
                id: {type: integer}
                title: {type: [string, "null"]}
                edition_type: {type: string, enum: [standard, annotated, illustrated, critical, abridged, revised]}
                publication_year: {type: [integer, "null"]}
    AdminIdentifierCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminIdentifier"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    IdentifierHolder:
      type: object
      required: [record_type, id, label, book]
      properties:
        record_type: {type: string, enum: [book, edition, author, series]}
        id: {type: integer, description: The holder's own id.}
        label: {type: [string, "null"], description: The holder's title or name.}
        book:
          description: For an edition, its book; null for any other holder.
          oneOf:
            - type: "null"
            - type: object
              required: [id, title]
              properties:
                id: {type: integer}
                title: {type: [string, "null"]}
    AdminIdentifierHolders:
      type: object
      required: [data, truncated]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/IdentifierHolder"
        truncated:
          type: boolean
          description: True when more than 100 records hold the identifier and only the first 100 (oldest identifier first) are listed.
    BookIdentifierRequest:
      type: object
      required: [identifier_type, value]
      properties:
        identifier_type:
          type: string
          enum: [books_work_oclc_id, books_work_wikidata_qid, books_work_openlibrary_id, books_work_goodreads_id, books_work_librarything_id, books_work_isbn13, books_work_isbn10, books_work_asin, books_work_ean13, books_work_openlibrary_duplicate_id]
        value:
          type: string
          minLength: 1
          maxLength: 255
          description: The identifier, normalised before it is stored (see the operation).
    AuthorIdentifierRequest:
      type: object
      required: [identifier_type, value]
      properties:
        identifier_type:
          type: string
          enum: [books_author_viaf, books_author_isni, books_author_wikidata_qid, books_author_openlibrary_id, books_author_goodreads_id, books_author_librarything_id, books_author_lcnaf]
        value:
          type: string
          minLength: 1
          maxLength: 255
          description: The identifier, normalised before it is stored (see the operation).
    AdminIdentifierWrite:
      type: object
      required: [data, promoted, also_held_by, truncated]
      properties:
        data:
          $ref: "#/components/schemas/AdminIdentifier"
        promoted:
          type: boolean
          description: True when the author already held this Wikidata QID or VIAF id from another source and the add made it admin-set (authoritative) and started an enrichment re-run. Always false for a new row and for book identifiers.
        also_held_by:
          type: array
          maxItems: 100
          description: Other records holding the same identifier type and value, oldest identifier first.
          items:
            $ref: "#/components/schemas/IdentifierHolder"
        truncated:
          type: boolean
          description: True when more than 100 other records hold it and only the first 100 are listed.
    AdminIdentifierDeleted:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminIdentifier"
    DuplicateMergeRequest:
      type: object
      required: [target_id, source_id]
      properties:
        target_id:
          description: The pair's record that survives. With `source_id` it must be exactly the pair's two record ids. A JSON integer, or a string of plain decimal digits (no sign, prefix or separators).
          oneOf:
            - {type: integer, minimum: 1}
            - {type: string, pattern: "^0*[1-9][0-9]*$"}
        source_id:
          description: The pair's record that is PERMANENTLY DELETED. Must differ from `target_id`; same formats.
          oneOf:
            - {type: integer, minimum: 1}
            - {type: string, pattern: "^0*[1-9][0-9]*$"}
        note:
          type: [string, "null"]
          maxLength: 1000
          description: Why, shown to admins reviewing the queue. Optional.
        dry_run: {type: boolean, default: false, description: Validate and report without merging.}
    DuplicateDismissRequest:
      type: object
      required: [record_ids]
      properties:
        record_ids:
          type: array
          minItems: 2
          maxItems: 2
          description: The pair's two record ids, as the get and list responses return them (either order). A pair re-keyed by another merge is refused (422).
          items: {type: integer, minimum: 1}
        note:
          type: [string, "null"]
          maxLength: 1000
          description: Why, shown to admins reviewing the queue. Optional.
    AdminDuplicateMerge:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: object
          required: [survivor, deleted, pair]
          properties:
            survivor:
              description: The record that remains, as it is after the merge. A book for a book pair, an author for an author pair.
              oneOf:
                - $ref: "#/components/schemas/AdminBook"
                - $ref: "#/components/schemas/AdminAuthor"
            deleted:
              description: The other record as it was before the merge. On a dry run it still exists.
              oneOf:
                - $ref: "#/components/schemas/AdminBook"
                - $ref: "#/components/schemas/AdminAuthor"
            pair:
              $ref: "#/components/schemas/AdminDuplicateCandidate"
        meta:
          type: object
          required: [dry_run]
          properties:
            dry_run: {type: boolean}
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/MergeWarning"
    AdminDuplicateDismiss:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [pair]
          properties:
            pair:
              $ref: "#/components/schemas/AdminDuplicateCandidate"
    AdminDuplicateCandidateCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminDuplicateCandidate"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    AdminBookCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminBook"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    AdminAuthorCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuthor"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    CategoryWrite:
      type: object
      description: Only the keys sent are used; unknown keys are ignored.
      properties:
        name: {type: string, description: "Required on create (a blank name is a 400); stored without surrounding space."}
        category_type:
          type: string
          enum: [genre, location, subject, theme, audience]
        description: {type: [string, "null"]}
        alternative_names:
          type: array
          items: {type: string}
        parent_id:
          description: The parent category's id (a books location, for a location), or null for none. A JSON integer, or a string of plain decimal digits.
          oneOf:
            - {type: integer, minimum: 1}
            - {type: string, pattern: "^0*[1-9][0-9]*$"}
            - {type: "null"}
    MergeRequest:
      type: object
      required: [source_id]
      properties:
        source_id:
          description: The duplicate to fold in and delete. A JSON integer, or a string of plain decimal digits (no sign, prefix or separators).
          oneOf:
            - {type: integer, minimum: 1}
            - {type: string, pattern: "^0*[1-9][0-9]*$"}
        dry_run: {type: boolean, default: false, description: Validate and report without merging.}
    CategoryMergeRequest:
      type: object
      required: [source_ids]
      properties:
        source_ids:
          description: The categories to fold into the one in the path and soft-delete. 1 to 50 distinct ids, none the target. Each is a JSON integer, or a string of plain decimal digits.
          type: array
          minItems: 1
          maxItems: 50
          items:
            oneOf:
              - {type: integer, minimum: 1}
              - {type: string, pattern: "^0*[1-9][0-9]*$"}
        dry_run: {type: boolean, default: false, description: Run every check and report without merging.}
    AdminCategoryMerge:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [target]
          properties:
            target:
              description: The surviving category, as it is after the merges (as it is now, for a dry run).
              $ref: "#/components/schemas/AdminCategory"
            merged:
              description: Ids merged, in order. Absent on a dry run.
              type: array
              items: {type: integer}
            post_commit_errors:
              description: Sources that merged but whose follow-up work raised. Present only when there were any.
              type: array
              items:
                type: object
                required: [id, message]
                properties:
                  id: {type: integer}
                  message: {type: string}
            sources:
              description: Present on a dry run only. What each source would carry over.
              type: array
              items:
                type: object
                required: [id, name, book_link_count, author_link_count]
                properties:
                  id: {type: integer}
                  name: {type: string}
                  book_link_count: {type: integer, minimum: 0}
                  author_link_count: {type: integer, minimum: 0}
        meta:
          type: object
          required: [dry_run]
          properties:
            dry_run: {type: boolean}
    AdminCategoryDelete:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [category, book_links_removed, author_links_removed]
          properties:
            category:
              $ref: "#/components/schemas/AdminCategory"
            book_links_removed: {type: integer, minimum: 0, description: Book links removed (or, on a dry run, that would be).}
            author_links_removed: {type: integer, minimum: 0, description: Author links removed (or, on a dry run, that would be).}
        meta:
          type: object
          required: [dry_run]
          properties:
            dry_run: {type: boolean}
    CategoryLinkRequest:
      type: object
      required: [category_id]
      properties:
        category_id:
          description: The category to link. A JSON integer, or a string of plain decimal digits.
          oneOf:
            - {type: integer, minimum: 1}
            - {type: string, pattern: "^0*[1-9][0-9]*$"}
    CategoryLink:
      type: object
      required: [id, slug, name, category_type, source]
      properties:
        id: {type: integer}
        slug: {type: [string, "null"]}
        name: {type: string}
        category_type: {type: string}
        source:
          type: string
          enum: [legacy, admin, inherited, goodreads]
          description: How the link came about. `inherited` links follow from a more specific location and cannot be removed directly.
    CategoryLinks:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CategoryLink"
    MergeWarning:
      type: object
      required: [code, detail]
      properties:
        code:
          type: string
          enum: [post_commit_error, book_authors_not_transferred, credits_not_transferred]
        detail: {type: string}
    AdminBookMerge:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: object
          required: [survivor, deleted]
          properties:
            survivor:
              description: The record that remains, as it is after the merge.
              $ref: "#/components/schemas/AdminBook"
            deleted:
              description: The source record as it was before the merge. On a dry run it still exists.
              $ref: "#/components/schemas/AdminBook"
        meta:
          type: object
          required: [dry_run]
          properties:
            dry_run: {type: boolean}
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/MergeWarning"
    AdminAuthorMerge:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: object
          required: [survivor, deleted]
          properties:
            survivor:
              description: The record that remains, as it is after the merge.
              $ref: "#/components/schemas/AdminAuthor"
            deleted:
              description: The source record as it was before the merge. On a dry run it still exists.
              $ref: "#/components/schemas/AdminAuthor"
        meta:
          type: object
          required: [dry_run]
          properties:
            dry_run: {type: boolean}
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/MergeWarning"

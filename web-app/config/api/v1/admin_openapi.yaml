      summary: Add an identifier to a book
      description: |
        Adds a `books_work_*` identifier to the book, stored with source `admin`. The value is normalised and checked: a Wikidata QID is `Q` and digits (upcased); an ISBN-13 is 13 digits and an ISBN-10 9 digits and a check digit 0-9 or X, each with a valid checksum, hyphens and spaces ignored; an Open Library work id is `OL`, digits and `W` (upcased); anything else is trimmed, non-blank and at most 255 characters. A type for another record kind or a bad value is 400, naming the expected form. A value the book already holds is 200 with that row, unchanged (`promoted` is always false). `also_held_by` lists other records holding the same type and value (at most 100; `truncated` says more exist). Requires `books:admin:write`, and the token's owner must be allowed to change the book.
      x-mcp:

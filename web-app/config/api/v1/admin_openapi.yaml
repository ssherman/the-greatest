openapi: 3.1.0
info:
  title: The Greatest API (admin)
  version: "1"
  description: |
    Administrative operations on The Greatest Books catalogue. Every endpoint needs a
    bearer token carrying a `books:admin:*` scope, which only an administrator or a
    books domain role holder can be issued, and which always expires. This document
    is served only to such tokens.
servers:
  - url: https://thegreatestbooks.org
security:
  - bearerAuth: []
paths:
  /api/v1/admin/openapi.json:
    x-domain: books
    get:
      operationId: getAdminOpenapi
      summary: This document
      description: Requires `books:admin:read`.
      responses:
        "200":
          description: The admin OpenAPI 3.1 document as JSON, with `servers` set to the host it was fetched from.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/books:
    x-domain: books
    get:
      operationId: searchAdminBooks
      summary: Search books
      description: Full-text search over titles, subtitles and author names. Unlike the public API this includes provisional (unreviewed import) books and every book kind. Requires `books:admin:read`. At most the first 1000 matches are paged.
      parameters:
        - name: q
          in: query
          required: true
          description: The search text. Blank is a 400.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of matching books, best match first.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBookCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/authors:
    x-domain: books
    get:
      operationId: searchAdminAuthors
      summary: Search authors
      description: Full-text search over author names, including provisional authors. Requires `books:admin:read`. At most the first 1000 matches are paged.
      parameters:
        - name: q
          in: query
          required: true
          description: The search text. Blank is a 400.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of matching authors, best match first.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthorCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/categories:
    x-domain: books
    get:
      operationId: searchAdminCategories
      summary: Search categories
      description: |
        Books categories of every status, by name. `q` is optional and matches the name and the alternative names as a case-insensitive substring; without it every category of the given filters is listed by name. With `q`, an exact name match comes first, then a name that starts with it, then a word that starts with it, then the rest. Requires `books:admin:read`.
      parameters:
        - name: q
          in: query
          required: false
          description: The search text.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Only categories of this type.
          schema:
            type: string
            enum: [genre, location, subject, theme, audience]
        - name: status
          in: query
          required: false
          description: "`active` (default) excludes deleted and merged categories; `deleted` is soft-deleted and not merged; `merged` is those folded into another."
          schema:
            type: string
            enum: [active, deleted, merged, all]
            default: active
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of matching categories.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategoryCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createAdminCategory
      summary: Create a category
      description: |
        Creates a books category. `name` is required; `category_type` defaults to `genre`. Refused (422) when an active category of the same type already uses the name, as its name or as an alias. Requires `books:admin:write`, and the token's owner must be allowed to write books categories.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "201":
          description: The category was created.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategoryDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/categories/{id}:
    x-domain: books
    get:
      operationId: getAdminCategory
      summary: One category, any status
      description: The category with its children and, for a location, its ancestors from the top down. Deleted and merged categories answer too. Requires `books:admin:read`.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The category.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategoryDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateAdminCategory
      summary: Edit a category
      description: |
        Changes only the keys sent. A rename keeps the id, and the old slug still resolves. Deleted and merged categories cannot be edited (422). Refused (422) when the new name belongs to another active category of the same type, as its name or as an alias; changing only the case of its own name is allowed. Requires `books:admin:write`, and the token's owner must be allowed to write books categories.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "200":
          description: The category after the change.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategoryDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteAdminCategory
      summary: Soft-delete a category
      description: |
        Marks the category deleted AND REMOVES EVERY ONE OF ITS LINKS to books and authors. The category row stays, but deleting it cannot be undone with the links intact: restoring it would not bring them back.
        Fiction, Nonfiction, Poetry and Religion & Spirituality cannot be deleted (422), and neither can a category that is already deleted (422).
        Child places of a deleted location keep pointing at it; only the category's own links are removed.
        Send `dry_run=true` to see the category and how many book and author links would be removed without changing anything.
        Requires `books:admin:merge`, and the token's owner must be allowed to delete the category.
      parameters:
        - $ref: "#/components/parameters/id"
        - name: dry_run
          in: query
          required: false
          description: "`true` reports what would be removed and changes nothing. Default `false`. Only `true` and `false` are accepted; anything else is a 400."
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: The category was deleted (or, for a dry run, would be).
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategoryDelete"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/categories/{id}/merge:
    x-domain: books
    post:
      operationId: mergeCategories
      summary: Merge categories into this one
      description: |
        Folds each category in `source_ids` (1 to 50, no repeats, never the target) into the category in the path, one at a time in the order given. Every source's links move to the target, the source is soft-deleted with `merged_into` pointing at the target, and its slug keeps resolving to the target. There is no undelete.
        Everything is checked before any merge runs: each id must exist (404 names the first missing one), the token's owner must be allowed to delete the target and every source (403 names it), and no source may be refused by the merger (422 lists every refused source as `id: reason`). Fiction, Nonfiction, Poetry and Religion & Spirituality cannot be merged.
        If a merge still fails part way, the request stops and answers 422 with `merged`, `failed` and `not_attempted`; the sources already merged stay merged.
        Send `dry_run: true` to run every check and see each source's link counts without changing anything. `dry_run` must be a boolean or `"true"`/`"false"`; anything else is a 400.
        A merge commits before its follow-up work (search reindex queueing) runs. If that follow-up raises, the source still counts as merged and the error is listed in `post_commit_errors`.
        Requires `books:admin:merge`.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryMergeRequest"
      responses:
        "200":
          description: The sources were merged (or, for a dry run, would be).
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategoryMerge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/books/{id}/merge:
    x-domain: books
    post:
      operationId: mergeBook
      summary: Merge a duplicate book
      description: |
        Folds the book named by `source_id` into the book in the path and PERMANENTLY DELETES the source.
        Requires `books:admin:merge`, and the token's owner must be allowed to delete both records.
        Send `dry_run: true` to validate and see both records without changing anything.
        There is no undelete.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeRequest"
      responses:
        "200":
          description: The merge was done (or, for a dry run, would succeed). `warnings` lists follow-up work that could not be completed.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBookMerge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/authors/{id}/merge:
    x-domain: books
    post:
      operationId: mergeAuthor
      summary: Merge a duplicate author
      description: |
        Folds the author named by `source_id` into the author in the path and PERMANENTLY DELETES the source.
        Requires `books:admin:merge`, and the token's owner must be allowed to delete both records.
        Send `dry_run: true` to validate and see both records without changing anything.
        There is no undelete.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeRequest"
      responses:
        "200":
          description: The merge was done (or, for a dry run, would succeed). `warnings` lists follow-up work that could not be completed.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthorMerge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/books/{id}/categories:
    x-domain: books
    post:
      operationId: tagBook
      summary: Tag a book with a category
      description: |
        Links the category in `category_id` to the book. Tagging twice is a success and changes nothing; tagging with a category that was inferred from a more specific location makes the link direct.
        Refused (422) when the category belongs to another section, was deleted, or was merged (the message names the category it was merged into).
        Requires `books:admin:write`, and the token's owner must be allowed to change both the book and the category.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryLinkRequest"
      responses:
        "200":
          description: The item's category links after the change, sorted by name.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/books/{id}/categories/{category_id}:
    x-domain: books
    delete:
      operationId: untagBook
      summary: Remove a category from a book
      description: |
        Removes a direct link. A link inferred from a more specific location cannot be removed directly (422, the message names the location to remove instead); a category the book does not have is 404.
        Requires `books:admin:write`, and the token's owner must be allowed to change both the book and the category.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/category_id"
      responses:
        "200":
          description: The item's category links after the change, sorted by name.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/authors/{id}/categories:
    x-domain: books
    post:
      operationId: tagAuthor
      summary: Tag an author with a category
      description: |
        Links the category in `category_id` to the author. Tagging twice is a success and changes nothing; tagging with a category that was inferred from a more specific location makes the link direct.
        Refused (422) when the category belongs to another section, was deleted, or was merged (the message names the category it was merged into).
        Requires `books:admin:write`, and the token's owner must be allowed to change both the author and the category.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryLinkRequest"
      responses:
        "200":
          description: The item's category links after the change, sorted by name.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/admin/authors/{id}/categories/{category_id}:
    x-domain: books
    delete:
      operationId: untagAuthor
      summary: Remove a category from an author
      description: |
        Removes a direct link. A link inferred from a more specific location cannot be removed directly (422, the message names the location to remove instead); a category the author does not have is 404.
        Requires `books:admin:write`, and the token's owner must be allowed to change both the author and the category.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/category_id"
      responses:
        "200":
          description: The item's category links after the change, sorted by name.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A personal access token (`tg_…`). Create one at /developers/tokens.
  parameters:
    page:
      name: page
      in: query
      description: 1-based page number. A page past the end returns an empty `data` array.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
        default: 1
    per_page:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    id:
      name: id
      in: path
      required: true
      description: The resource's integer id.
      schema:
        type: integer
        minimum: 1
    category_id:
      name: category_id
      in: path
      required: true
      description: The category's integer id.
      schema:
        type: integer
        minimum: 1
  headers:
    X-RateLimit-Limit:
      description: Requests allowed per calendar minute.
      schema: {type: integer}
    X-RateLimit-Remaining:
      description: Requests left in the current minute.
      schema: {type: integer}
    X-RateLimit-Reset:
      description: Unix time at which the minute window resets.
      schema: {type: integer}
    X-RateLimit-Daily-Limit:
      description: Requests allowed per UTC day.
      schema: {type: integer}
    X-RateLimit-Daily-Remaining:
      description: Requests left today.
      schema: {type: integer}
    X-RateLimit-Daily-Reset:
      description: Unix time of the next 00:00 UTC.
      schema: {type: integer}
    Retry-After:
      description: Seconds until the exhausted window resets.
      schema: {type: integer}
    WWW-Authenticate:
      description: RFC 6750 challenge.
      schema: {type: string}
  responses:
    BadRequest:
      description: A query parameter or body field is malformed or out of range.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Daily-Limit:
          $ref: "#/components/headers/X-RateLimit-Daily-Limit"
        X-RateLimit-Daily-Remaining:
          $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
        X-RateLimit-Daily-Reset:
          $ref: "#/components/headers/X-RateLimit-Daily-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No token, or a token that is malformed, unknown, revoked or expired.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWW-Authenticate"
          required: true
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The token lacks the admin scope this endpoint needs, or its owner no longer qualifies for it (`insufficient_scope`); or, on a merge or a tag change, the owner may not change one of the records (`forbidden`).
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWW-Authenticate"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No record at that address (unknown slug or id).
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Daily-Limit:
          $ref: "#/components/headers/X-RateLimit-Daily-Limit"
        X-RateLimit-Daily-Remaining:
          $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
        X-RateLimit-Daily-Reset:
          $ref: "#/components/headers/X-RateLimit-Daily-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: The request was understood but is not allowed or failed (`unprocessable`), for example merging a record into itself, or giving a category a name another one already uses.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Daily-Limit:
          $ref: "#/components/headers/X-RateLimit-Daily-Limit"
        X-RateLimit-Daily-Remaining:
          $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
        X-RateLimit-Daily-Reset:
          $ref: "#/components/headers/X-RateLimit-Daily-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: A rate-limit window is exhausted. `Retry-After` says when it resets.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
          required: true
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      description: RFC 9457 Problem Details with a stable `code`.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum: [unauthenticated, invalid_token, membership_required, insufficient_scope, forbidden, not_found, invalid_parameter, unprocessable, rate_limited]
        detail:
          type: string
        merged:
          description: Category merge only, on a 422 that came part way. Ids already merged; they stay merged.
          type: array
          items: {type: integer}
        failed:
          description: Category merge only, on a 422 that came part way. The source that failed.
          type: object
          required: [id, message]
          properties:
            id: {type: integer}
            message: {type: string}
        not_attempted:
          description: Category merge only, on a 422 that came part way. Ids never tried.
          type: array
          items: {type: integer}
        post_commit_errors:
          description: Category merge only. Sources listed in `merged` whose follow-up work raised after the merge committed.
          type: array
          items:
            type: object
            required: [id, message]
            properties:
              id: {type: integer}
              message: {type: string}
    PaginationMeta:
      type: object
      required: [page, per_page, total_count, total_pages]
      properties:
        page: {type: integer, minimum: 1}
        per_page: {type: integer, minimum: 1, maximum: 100}
        total_count: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 1}
    PaginationLinks:
      type: object
      required: [self, next, prev, first, last]
      properties:
        self: {type: string, format: uri}
        next: {type: [string, "null"], format: uri}
        prev: {type: [string, "null"], format: uri}
        first: {type: string, format: uri}
        last: {type: string, format: uri}
    AuthorSummary:
      type: object
      required: [id, slug, name]
      properties:
        id: {type: integer}
        slug: {type: string}
        name: {type: string}
    AdminBook:
      type: object
      required: [id, slug, title, subtitle, book_kind, provisional, first_published_year, rank, authors]
      properties:
        id: {type: integer}
        slug: {type: string}
        title: {type: string}
        subtitle: {type: [string, "null"]}
        book_kind:
          type: string
          enum: [standalone, collection]
        provisional: {type: boolean, description: An unreviewed import, absent from the public catalogue.}
        first_published_year: {type: [integer, "null"]}
        rank:
          type: [integer, "null"]
          description: Position in the site's primary ranking; null when unranked.
        authors:
          type: array
          items:
            $ref: "#/components/schemas/AuthorSummary"
    AdminAuthor:
      type: object
      required: [id, slug, name, kind, provisional, birth_year, death_year, rank, book_count]
      properties:
        id: {type: integer}
        slug: {type: string}
        name: {type: string}
        kind:
          type: string
          enum: [person, organization, pseudonym, collective]
        provisional: {type: boolean}
        birth_year: {type: [integer, "null"]}
        death_year: {type: [integer, "null"]}
        rank:
          type: [integer, "null"]
          description: Position in the site's primary author ranking; null when unranked.
        book_count: {type: integer, minimum: 0, description: Books credited to this author, provisional included.}
    CategoryRef:
      type: object
      required: [id, slug, name]
      properties:
        id: {type: integer}
        slug: {type: [string, "null"]}
        name: {type: string}
    AdminCategory:
      type: object
      required: [id, slug, name, category_type, description, parent, book_count, alternative_names, deleted, merged_into, item_count, book_link_count, author_link_count, children_count, import_source, created_at, updated_at]
      properties:
        id: {type: integer}
        slug: {type: [string, "null"]}
        name: {type: string}
        category_type:
          type: string
          enum: [genre, location, subject, theme, audience]
        description: {type: [string, "null"]}
        parent:
          description: The raw parent, even when it is deleted or merged.
          oneOf:
            - {type: "null"}
            - $ref: "#/components/schemas/CategoryRef"
        book_count: {type: integer, minimum: 0, description: Books in the site's primary ranking that carry this category.}
        alternative_names:
          type: array
          items: {type: string}
        deleted: {type: boolean, description: True for a soft-deleted category and for one merged into another.}
        merged_into:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: {type: integer}
            name: {type: string}
        item_count: {type: integer, minimum: 0, description: The catalog counter cache, all item types.}
        book_link_count: {type: integer, minimum: 0, description: Books carrying the category, any source.}
        author_link_count: {type: integer, minimum: 0, description: Authors carrying the category, any source.}
        children_count: {type: integer, minimum: 0}
        import_source:
          type: [string, "null"]
          enum: [amazon, open_library, openai, goodreads, musicbrainz, igdb, null]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminCategoryFull:
      allOf:
        - $ref: "#/components/schemas/AdminCategory"
        - type: object
          required: [children, ancestors]
          properties:
            children:
              type: array
              items:
                $ref: "#/components/schemas/CategoryRef"
            ancestors:
              type: array
              description: A location's parents, root first. Empty for every other type.
              items:
                $ref: "#/components/schemas/CategoryRef"
    AdminCategoryDetail:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminCategoryFull"
    AdminCategoryCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminCategory"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    AdminBookCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminBook"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    AdminAuthorCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuthor"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    CategoryWrite:
      type: object
      description: Only the keys sent are used; unknown keys are ignored.
      properties:
        name: {type: string, description: "Required on create (a blank name is a 400); stored without surrounding space."}
        category_type:
          type: string
          enum: [genre, location, subject, theme, audience]
        description: {type: [string, "null"]}
        alternative_names:
          type: array
          items: {type: string}
        parent_id:
          description: The parent category's id (a books location, for a location), or null for none. A JSON integer, or a string of plain decimal digits.
          oneOf:
            - {type: integer, minimum: 1}
            - {type: string, pattern: "^0*[1-9][0-9]*$"}
            - {type: "null"}
    MergeRequest:
      type: object
      required: [source_id]
      properties:
        source_id:
          description: The duplicate to fold in and delete. A JSON integer, or a string of plain decimal digits (no sign, prefix or separators).
          oneOf:
            - {type: integer, minimum: 1}
            - {type: string, pattern: "^0*[1-9][0-9]*$"}
        dry_run: {type: boolean, default: false, description: Validate and report without merging.}
    CategoryMergeRequest:
      type: object
      required: [source_ids]
      properties:
        source_ids:
          description: The categories to fold into the one in the path and soft-delete. 1 to 50 distinct ids, none the target. Each is a JSON integer, or a string of plain decimal digits.
          type: array
          minItems: 1
          maxItems: 50
          items:
            oneOf:
              - {type: integer, minimum: 1}
              - {type: string, pattern: "^0*[1-9][0-9]*$"}
        dry_run: {type: boolean, default: false, description: Run every check and report without merging.}
    AdminCategoryMerge:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [target]
          properties:
            target:
              description: The surviving category, as it is after the merges (as it is now, for a dry run).
              $ref: "#/components/schemas/AdminCategory"
            merged:
              description: Ids merged, in order. Absent on a dry run.
              type: array
              items: {type: integer}
            post_commit_errors:
              description: Sources that merged but whose follow-up work raised. Present only when there were any.
              type: array
              items:
                type: object
                required: [id, message]
                properties:
                  id: {type: integer}
                  message: {type: string}
            sources:
              description: Present on a dry run only. What each source would carry over.
              type: array
              items:
                type: object
                required: [id, name, book_link_count, author_link_count]
                properties:
                  id: {type: integer}
                  name: {type: string}
                  book_link_count: {type: integer, minimum: 0}
                  author_link_count: {type: integer, minimum: 0}
        meta:
          type: object
          required: [dry_run]
          properties:
            dry_run: {type: boolean}
    AdminCategoryDelete:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [category, book_links_removed, author_links_removed]
          properties:
            category:
              $ref: "#/components/schemas/AdminCategory"
            book_links_removed: {type: integer, minimum: 0, description: Book links removed (or, on a dry run, that would be).}
            author_links_removed: {type: integer, minimum: 0, description: Author links removed (or, on a dry run, that would be).}
        meta:
          type: object
          required: [dry_run]
          properties:
            dry_run: {type: boolean}
    CategoryLinkRequest:
      type: object
      required: [category_id]
      properties:
        category_id:
          description: The category to link. A JSON integer, or a string of plain decimal digits.
          oneOf:
            - {type: integer, minimum: 1}
            - {type: string, pattern: "^0*[1-9][0-9]*$"}
    CategoryLink:
      type: object
      required: [id, slug, name, category_type, source]
      properties:
        id: {type: integer}
        slug: {type: [string, "null"]}
        name: {type: string}
        category_type: {type: string}
        source:
          type: string
          enum: [legacy, admin, inherited, goodreads]
          description: How the link came about. `inherited` links follow from a more specific location and cannot be removed directly.
    CategoryLinks:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CategoryLink"
    MergeWarning:
      type: object
      required: [code, detail]
      properties:
        code:
          type: string
          enum: [post_commit_error, book_authors_not_transferred, credits_not_transferred]
        detail: {type: string}
    AdminBookMerge:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: object
          required: [survivor, deleted]
          properties:
            survivor:
              description: The record that remains, as it is after the merge.
              $ref: "#/components/schemas/AdminBook"
            deleted:
              description: The source record as it was before the merge. On a dry run it still exists.
              $ref: "#/components/schemas/AdminBook"
        meta:
          type: object
          required: [dry_run]
          properties:
            dry_run: {type: boolean}
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/MergeWarning"
    AdminAuthorMerge:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: object
          required: [survivor, deleted]
          properties:
            survivor:
              description: The record that remains, as it is after the merge.
              $ref: "#/components/schemas/AdminAuthor"
            deleted:
              description: The source record as it was before the merge. On a dry run it still exists.
              $ref: "#/components/schemas/AdminAuthor"
        meta:
          type: object
          required: [dry_run]
          properties:
            dry_run: {type: boolean}
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/MergeWarning"

      summary: A book's identifiers
      description: |
        The identifiers held by the book itself, then those held by its editions (by edition id), one row each and paged. `scope=work` returns only the book's own. A row's `edition` is null for the book's own identifiers and names the edition otherwise. `source` is who attached the identifier (legacy, open_library, worldcat, goodreads_import, amazon, wikidata, viaf, goodreads, admin) or null. A book that does not exist is 404. Requires `books:admin:read`.
      x-mcp:
        description: >-
          Lists a book's identifiers: its own (ISBNs, ASINs, Open Library, Goodreads and Wikidata ids and the like) first, then
          its editions', each row with `identifier_type`, `value`, `source` and `created_at`, and `edition` (id, title,
          edition_type, publication_year) when an edition holds it, else null. Pass `scope=work` for only the book's own
          rows. Some books hold thousands of identifiers, so it is paged: follow `page` until `total_pages`. Book ids come
          from search_admin_books. A 404 means no such book.
      parameters:
        - $ref: "#/components/parameters/id"
        - name: scope
          in: query

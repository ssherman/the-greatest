        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A personal access token (`tg_…`). Create one at /developers/tokens.
  parameters:
    page:
      name: page
      in: query
      description: 1-based page number. A page past the end returns an empty `data` array.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
        default: 1
    per_page:
      name: per_page
      in: query
      description: Results per page, at most 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    category_id:
      name: category_id
      in: query
      required: false
      description: Comma-separated category slugs, up to 6. A book must carry every one. Merged and renamed slugs resolve.
      schema: {type: string, minLength: 1}
    country_id:
      name: country_id
      in: query
      required: false
      description: Comma-separated country slugs, up to 10. A book from any of them matches. Cannot be combined with collection.
      schema: {type: string, minLength: 1}
    year:
      name: year
      in: query
      required: false
      description: Books first published in this year. Cannot be combined with published_start or published_end.
      schema: {type: integer, minimum: -4000}
    published_start:
      name: published_start
      in: query
      required: false
      description: Books first published in or after this year.
      schema: {type: integer, minimum: -4000}
    published_end:
      name: published_end
      in: query
      required: false
      description: Books first published in or before this year.
      schema: {type: integer, minimum: -4000}
    collection:
      name: collection
      in: query
      required: false
      description: A curated collection, as on the site. The values are the slugs in Books::CollectionsRegistry (a test keeps the two in step).
      schema: {type: string, enum: [women, africa, asia, latin-america, western, non-western]}
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    id:
      name: id
      in: path
      required: true
      description: The resource's integer id.
      schema:
        type: integer
        minimum: 1
  headers:
    X-RateLimit-Limit:
      description: Requests allowed per calendar minute.
      schema: {type: integer}
    X-RateLimit-Remaining:
      description: Requests left in the current minute.
      schema: {type: integer}
    X-RateLimit-Reset:
      description: Unix time at which the minute window resets.
      schema: {type: integer}
    X-RateLimit-Daily-Limit:
      description: Requests allowed per UTC day.
      schema: {type: integer}
    X-RateLimit-Daily-Remaining:
      description: Requests left today.
      schema: {type: integer}
    X-RateLimit-Daily-Reset:
      description: Unix time of the next 00:00 UTC.
      schema: {type: integer}
    Retry-After:
      description: Seconds until the exhausted window resets.
      schema: {type: integer}
    WWW-Authenticate:
      description: RFC 6750 challenge.
      schema: {type: string}
  responses:
    BadRequest:
      description: A query parameter is malformed or out of range.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Daily-Limit:
          $ref: "#/components/headers/X-RateLimit-Daily-Limit"
        X-RateLimit-Daily-Remaining:
          $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
        X-RateLimit-Daily-Reset:
          $ref: "#/components/headers/X-RateLimit-Daily-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No token, or a token that is malformed, unknown, revoked or expired.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWW-Authenticate"
          required: true
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The token is valid but its account is not a member (`membership_required`) or lacks the scope this host needs (`insufficient_scope`).
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWW-Authenticate"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No record at that address (unknown slug or id).
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Daily-Limit:
          $ref: "#/components/headers/X-RateLimit-Daily-Limit"
        X-RateLimit-Daily-Remaining:
          $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
        X-RateLimit-Daily-Reset:
          $ref: "#/components/headers/X-RateLimit-Daily-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: A rate-limit window is exhausted. `Retry-After` says when it resets.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
          required: true
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A service this endpoint depends on is down. Retry shortly.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Daily-Limit:
          $ref: "#/components/headers/X-RateLimit-Daily-Limit"
        X-RateLimit-Daily-Remaining:
          $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
        X-RateLimit-Daily-Reset:
          $ref: "#/components/headers/X-RateLimit-Daily-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      description: RFC 9457 Problem Details with a stable `code`.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum: [unauthenticated, invalid_token, membership_required, insufficient_scope, not_found, invalid_parameter, rate_limited, search_unavailable]
        detail:
          type: string
    PaginationMeta:
      type: object
      required: [page, per_page, total_count, total_pages]
      properties:
        page: {type: integer, minimum: 1}
        per_page: {type: integer, minimum: 1, maximum: 100}
        total_count: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 1}
    PaginationLinks:
      type: object
      required: [self, next, prev, first, last]
      properties:
        self: {type: string, format: uri}
        next: {type: [string, "null"], format: uri}
        prev: {type: [string, "null"], format: uri}
        first: {type: string, format: uri}
        last: {type: string, format: uri}
    AuthorSummary:
      type: object
      required: [id, slug, name]
      properties:
        id: {type: integer}
        slug: {type: string}
        name: {type: string}
    Book:
      type: object
      required: [id, slug, title, subtitle, first_published_year, rank, authors, cover_url, url, api_url]
      properties:
        id: {type: integer}
        slug: {type: string}
        title: {type: string}
        subtitle: {type: [string, "null"]}
        first_published_year: {type: [integer, "null"]}
        rank:
          type: [integer, "null"]
          description: Position in the site's primary ranking; null when unranked.
        authors:
          type: array
          items:
            $ref: "#/components/schemas/AuthorSummary"
        cover_url: {type: [string, "null"], format: uri}
        url: {type: string, format: uri, description: The book's page on the site.}
        api_url: {type: string, format: uri}
    BookFull:
      allOf:
        - $ref: "#/components/schemas/Book"
        - type: object
          required: [sort_title, alternate_titles, book_kind, book_length, page_range, word_count, description, original_language, categories, countries]
          properties:
            sort_title: {type: [string, "null"]}
            alternate_titles:
              type: array
              items: {type: string}
            book_kind:
              type: string
              enum: [standalone, collection]
            book_length:
              type: [string, "null"]
              enum: [very_short, short, medium, moderate, long, very_long, null]
            page_range: {type: [string, "null"]}
            word_count: {type: [integer, "null"]}
            description: {type: [string, "null"]}
            original_language:
              type: [object, "null"]
              required: [id, slug, name]
              properties:
                id: {type: integer}
                slug: {type: string}
                name: {type: string}
            categories:
              type: array
              items:
                type: object
                required: [id, slug, name, category_type]
                properties:
                  id: {type: integer}
                  slug: {type: [string, "null"]}
                  name: {type: string}
                  category_type: {type: string, description: "genre, audience (Children's, Middle Grade, Young Adult), subject, location or theme"}
            countries:
              type: array
              items:
                type: object
                required: [id, slug, name]
                properties:
                  id: {type: integer}
                  slug: {type: string}
                  name: {type: string}
    BookCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Book"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    SimilarBookCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Book"
        meta:
          type: object
          required: [more_available]
          properties:
            more_available:
              type: boolean
              description: True when more similar books may exist beyond this response.
    AppliedFilters:
      type: object
      additionalProperties: false
      description: The filters the server applied, in canonical form. Only the ones that were sent appear.
      properties:
        category_id: {type: string}
        country_id: {type: string}
        year: {type: integer}
        published_start: {type: integer}
        published_end: {type: integer}
        collection: {type: string}
    RankedBookCollection:
      allOf:
        - $ref: "#/components/schemas/BookCollection"
        - type: object
          properties:
            meta:
              type: object
              properties:
                filters:
                  $ref: "#/components/schemas/AppliedFilters"
    BookItem:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/BookFull"
    Author:
      type: object
      required: [id, slug, name, sort_name, birth_year, death_year, rank, image_url, url, api_url]
      properties:
        id: {type: integer}
        slug: {type: string}
        name: {type: string}
        sort_name: {type: [string, "null"]}
        birth_year: {type: [integer, "null"]}
        death_year: {type: [integer, "null"]}
        rank:
          type: [integer, "null"]
          description: Position in the site's primary author ranking; null when unranked.
        image_url: {type: [string, "null"], format: uri}
        url: {type: string, format: uri, description: The author's page on the site.}
        api_url: {type: string, format: uri}
    AuthorFull:
      allOf:
        - $ref: "#/components/schemas/Author"
        - type: object
          required: [alternate_names, kind, description]
          properties:
            alternate_names:
              type: array
              items: {type: string}
            kind:
              type: string
              enum: [person, organization, pseudonym, collective]
            description: {type: [string, "null"]}
    AuthorCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Author"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    AuthorItem:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AuthorFull"
    RankingConfiguration:
      type: object
      required: [id, name, kind, primary, year, description, published_at, last_refreshed_at, item_count, list_count, url, api_url, books_api_url, lists_api_url]
      properties:
        id: {type: integer}
        name: {type: string}
        kind:
          type: string
          enum: [books]
          description: What this configuration ranks. Only `books` today; more kinds will be added, never removed.
        primary:
          type: boolean
          description: Whether this is the site's primary book ranking — the one `/api/v1/books` reads and a book's `rank` refers to everywhere outside this resource. An author's `rank` comes from the separate primary author ranking.
        year: {type: [integer, "null"]}
        description: {type: [string, "null"]}
        published_at: {type: [string, "null"], format: date-time}
        last_refreshed_at:
          type: [string, "null"]
          format: date-time
          description: When the ranking was last calculated.
        item_count:
          type: integer
          minimum: 0
          description: Books ranked by this configuration.
        list_count:
          type: integer
          minimum: 0
          description: Active lists that feed this configuration.
        url: {type: string, format: uri, description: The ranking's page on the site.}
        api_url: {type: string, format: uri}
        books_api_url: {type: string, format: uri, description: The ranked books, best first.}
        lists_api_url: {type: string, format: uri, description: The active lists that feed it, heaviest first.}
    RankingConfigurationCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RankingConfiguration"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    RankingConfigurationItem:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RankingConfiguration"
    List:
      type: object
      required: [id, name, source, year_published, yearly_award, number_of_voters, item_count, weight, activated_at, url, api_url, items_api_url]
      properties:
        id: {type: integer}
        name: {type: string}
        source: {type: [string, "null"], description: Who published the list.}
        year_published: {type: [integer, "null"]}
        yearly_award:
          type: [boolean, "null"]
          description: Whether the list is one year's award or best-of rather than an all-time list.
        number_of_voters: {type: [integer, "null"]}
        item_count:
          type: integer
          minimum: 0
          description: Books on the list — the rows `items_api_url` serves.
        weight:
          type: [integer, "null"]
          description: The list's weight on the ranking configuration it was read through — the primary for `/api/v1/lists`, `/api/v1/lists/{id}` and a book's listings; null when the list has no weight on it — it does not feed that configuration, or has not been weighted yet.
        activated_at:
          type: [string, "null"]
          format: date-time
          description: When the list went live on the site.
        url: {type: string, format: uri, description: The list's page on the site.}
        api_url: {type: string, format: uri}
        items_api_url: {type: string, format: uri, description: The list's books, in list order.}
    ListFull:
      allOf:
        - $ref: "#/components/schemas/List"
        - type: object
          required: [description, source_url]
          properties:
            description: {type: [string, "null"]}
            source_url:
              type: [string, "null"]
              description: The original list on the web, as recorded — a few carry more than one address.
    ListCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/List"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    ListItem:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ListFull"
    ListItemRow:
      type: object
      required: [position, book]
      properties:
        position:
          type: [integer, "null"]
          minimum: 1
          description: The book's place on the list as published; null when the list is unordered.
        book:
          $ref: "#/components/schemas/Book"
    ListItemCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ListItemRow"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    BookListingRow:
      type: object
      required: [position, list]
      properties:
        position:
          type: [integer, "null"]
          minimum: 1
          description: The book's place on this list as published; null when the list is unordered.
        list:
          $ref: "#/components/schemas/List"
    Category:
      type: object
      required: [id, slug, name, category_type, description, parent, book_count]
      properties:
        id: {type: integer}
        slug: {type: [string, "null"]}
        name: {type: string}
        category_type: {type: string, description: "genre, audience (Children's, Middle Grade, Young Adult), subject, location or theme"}
        description: {type: [string, "null"]}
        parent:
          type: [object, "null"]
          required: [id, slug, name]
          properties:
            id: {type: integer}
            slug: {type: [string, "null"]}
            name: {type: string}
        book_count:
          type: integer
          minimum: 0
          description: Books in the site's primary ranking that carry this category.
    CategoryCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"
    CategoryItem:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Category"
    BookListingCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BookListingRow"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        links:
          $ref: "#/components/schemas/PaginationLinks"

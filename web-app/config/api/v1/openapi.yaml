openapi: 3.1.0
info:
  title: The Greatest API
  version: "1"
  description: |
    Read access to the ranked catalogues of The Greatest Books, The Greatest Music and
    The Greatest Games. Every endpoint except this document needs a bearer token; tokens
    are a membership benefit. Version 1 evolves additively: fields are added, never
    renamed, removed or retyped.
servers:
  - url: https://thegreatestbooks.org
security:
  - bearerAuth: []
paths:
  /api/v1/openapi.json:
    get:
      operationId: getOpenapi
      summary: This document
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document as JSON, with `servers` set to the host it was fetched from and only the paths that host serves.
          content:
            application/json:
              schema:
                type: object
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/books:
    x-domain: books
    get:
      operationId: listBooks
      security: [{bearerAuth: ["books:read"]}]
      summary: Books in rank order
      description: The Greatest Books' primary ranking, best first. Only ranked books appear. The filter parameters narrow the list as they do on the site; `meta.filters` echoes the ones applied.
      x-mcp:
        description: >-
          Returns the primary ranking of The Greatest Books, best first, one page at a time; each book
          carries its `rank`, title, authors and first-published year. Use it for "top N" questions,
          narrowing with `country_id`, `year`, `category_id`, `collection` or the published range
          (list_categories finds category slugs; a book's `countries`, from get_book, shows country
          slugs), and prefer search_books when you have a title or author. `limit` is at most 100;
          `meta.total_count` gives the size of the whole result.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/category_id"
        - $ref: "#/components/parameters/country_id"
        - $ref: "#/components/parameters/year"
        - $ref: "#/components/parameters/published_start"
        - $ref: "#/components/parameters/published_end"
        - $ref: "#/components/parameters/collection"
      responses:
        "200":
          description: A page of ranked books.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankedBookCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/books/{slug}:
    x-domain: books
    get:
      operationId: getBook
      security: [{bearerAuth: ["books:read"]}]
      summary: One book
      x-mcp:
        description: >-
          Returns one book by slug with its full record: rank, subtitle, description, categories,
          countries, original language, length and alternate titles. Use it once you have a slug from
          list_books or search_books.
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: The book.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/books/{slug}/lists:
    x-domain: books
    get:
      operationId: listBookLists
      security: [{bearerAuth: ["books:read"]}]
      summary: Lists a book is on
      description: Every active list the book appears on, with its `position` there. Lists that feed the primary ranking come first, heaviest first; the rest follow by id with `weight` null.
      x-mcp:
        description: >-
          Returns the active lists one book appears on and its `position` on each, with the lists that
          feed the primary ranking first, heaviest first. Use it to see which sources recommend a book and
          why it ranks where it does.
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of the book's listings.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListingCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/books/{slug}/similar:
    x-domain: books
    get:
      operationId: listSimilarBooks
      security: [{bearerAuth: ["books:read"]}]
      summary: Books similar to a book
      description: |
        Books like this one, scored from the genres, subjects and locations they share, most similar first. At most two books per author appear. Only catalogued books are returned (not books still awaiting review), each with its primary-ranking `rank` (null when unranked). This is a top-N, not a paginated list: `limit` caps it and there are no `links`. `meta.more_available` is true when more similar books may exist beyond this response. When the search service is down the answer is a 503 with code `search_unavailable`; retry shortly.
      x-mcp:
        description: >-
          Returns the books most similar to one book, most similar first, at most two per author, each with
          its primary-ranking `rank` (null when unranked). `meta.more_available` is true when more
          similar books may exist beyond this response. Take the slug from search_books or find_book; `limit` is at most 25. Use get_book
          for any one result's detail.
      parameters:
        - $ref: "#/components/parameters/slug"
        - name: limit
          in: query
          required: false
          description: How many similar books to return, at most 25.
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
      responses:
        "200":
          description: The book's similar books.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarBookCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/authors:
    x-domain: books
    get:
      operationId: listAuthors
      security: [{bearerAuth: ["books:read"]}]
      summary: Authors in rank order
      description: The Greatest Books' primary author ranking, best first. Only ranked authors appear. Empty until an author ranking has been calculated.
      x-mcp:
        description: >-
          Returns the primary author ranking, best first, with each author's `rank` and birth and death
          years. It is empty until an author ranking has been calculated; use get_author for one author's
          detail.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of ranked authors.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/authors/{slug}:
    x-domain: books
    get:
      operationId: getAuthor
      security: [{bearerAuth: ["books:read"]}]
      summary: One author
      description: The author alone. Their books are not embedded; they are a paginated sub-collection at `GET /api/v1/authors/{slug}/books`.
      x-mcp:
        description: >-
          Returns one author by slug: rank, birth and death years, kind (person, organization, pseudonym
          or collective), alternate names and description. It does not list their books; use
          list_author_books with the same slug.
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: The author.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/authors/{slug}/books:
    x-domain: books
    get:
      operationId: listAuthorBooks
      security: [{bearerAuth: ["books:read"]}]
      summary: An author's books
      description: The books the author wrote (not ones they only edited), ranked books first in rank order on the site's primary ranking, then the unranked ones (`rank` null) by first publication year and then title. Books still awaiting review are left out. There are no filter parameters.
      x-mcp:
        description: >-
          Returns an author's whole bibliography: their ranked books first, in rank order on the primary
          ranking, then their unranked books with a null `rank`. Use it for "what did this author write"
          once you have the author's slug from search_authors or from a book's `authors`; for a
          non-primary ranking use list_ranking_configuration_author_books.
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of the author's books.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/ranking_configurations/{id}/authors/{slug}/books:
    x-domain: books
    get:
      operationId: listRankingConfigurationAuthorBooks
      security: [{bearerAuth: ["books:read"]}]
      summary: An author's books on one configuration
      description: The same rows and shape as `/api/v1/authors/{slug}/books`, ranked by the named configuration; `rank` is relative to it, and null for a book that configuration does not rank. Ranked books come first in rank order, then the unranked ones by first publication year and then title.
      x-mcp:
        description: >-
          Returns an author's whole bibliography ranked by one named ranking configuration (an `id` from
          list_ranking_configurations): books that configuration ranks first, in its order, then the
          rest with a null `rank`. Prefer list_author_books unless you need a non-primary ranking.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of the author's books.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/ranking_configurations:
    x-domain: books
    get:
      operationId: listRankingConfigurations
      security: [{bearerAuth: ["books:read"]}]
      summary: Ranking configurations
      description: The global book rankings the site publishes, primary first. A book's `rank` and a list's `weight` are always relative to one of these.
      x-mcp:
        description: >-
          Lists the book rankings the site publishes, the primary one first, with each one's `id`, year,
          and book and list counts. Use it to find the `id` the ranking_configuration tools take;
          list_books already reads the primary ranking.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of ranking configurations.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingConfigurationCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/ranking_configurations/{id}:
    x-domain: books
    get:
      operationId: getRankingConfiguration
      security: [{bearerAuth: ["books:read"]}]
      summary: One ranking configuration
      x-mcp:
        description: >-
          Returns one ranking configuration by `id`: its name, whether it is the primary ranking, when it
          was last calculated, and how many books and lists it has. Use it to learn what a configuration
          is before reading its books or lists.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The ranking configuration.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingConfigurationItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/ranking_configurations/{id}/books:
    x-domain: books
    get:
      operationId: listRankingConfigurationBooks
      security: [{bearerAuth: ["books:read"]}]
      summary: Books in rank order on one configuration
      description: The same rows and shape as `/api/v1/books`, ranked by the named configuration; `rank` is relative to it. Only ranked books appear.
      x-mcp:
        description: >-
          Returns the books ranked best first by one named ranking configuration (an `id` from
          list_ranking_configurations), taking the same filters as list_books. A book's `rank` here is
          relative to that configuration; for the primary ranking use list_books.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/category_id"
        - $ref: "#/components/parameters/country_id"
        - $ref: "#/components/parameters/year"
        - $ref: "#/components/parameters/published_start"
        - $ref: "#/components/parameters/published_end"
        - $ref: "#/components/parameters/collection"
      responses:
        "200":
          description: A page of ranked books.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankedBookCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/ranking_configurations/{id}/lists:
    x-domain: books
    get:
      operationId: listRankingConfigurationLists
      security: [{bearerAuth: ["books:read"]}]
      summary: Lists behind one configuration
      description: The same rows and shape as `/api/v1/lists`, on the named configuration; `weight` is relative to it.
      x-mcp:
        description: >-
          Returns the lists that feed one named ranking configuration, heaviest first; `weight` is
          relative to that configuration. For the primary ranking use list_lists.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of lists.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/lists:
    x-domain: books
    get:
      operationId: listLists
      security: [{bearerAuth: ["books:read"]}]
      summary: Lists behind the primary ranking
      description: The active lists that feed The Greatest Books' primary ranking, heaviest first. `weight` is the list's weight on that ranking; `item_count` is the number of books `items_api_url` serves.
      x-mcp:
        description: >-
          Returns the active lists that feed the primary ranking, heaviest first, each with its source,
          year, voter count, `weight` and `item_count`. Use get_list for one list and list_list_items for
          the books on it.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of lists.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Daily-Limit:
              $ref: "#/components/headers/X-RateLimit-Daily-Limit"
            X-RateLimit-Daily-Remaining:
              $ref: "#/components/headers/X-RateLimit-Daily-Remaining"
            X-RateLimit-Daily-Reset:
              $ref: "#/components/headers/X-RateLimit-Daily-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/lists/{id}:

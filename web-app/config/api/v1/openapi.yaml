  /api/v1/search/books:
    x-domain: books
    get:
      operationId: searchBooks
      security: [{bearerAuth: ["books:read"]}]
      summary: Search books
      description: |
        Full-text search over the catalogue, best match first. `q` is required; a missing or blank `q` is a 400. Only standalone, catalogued books are returned (not collections, and not books still awaiting review). A query yields at most 100 matches, so `total_count` never exceeds 100: refine the query rather than paging for more. `rank` is the book's position in the site's primary ranking, or null when it is unranked. When the search service is down the answer is a 503 with code `search_unavailable`; retry shortly.
      x-mcp:
        description: >-
          Full-text search over the catalogue for a title or author, best match first, with each book's
          primary-ranking `rank` (null when unranked). A query returns at most 100 matches in all, so
          refine the query rather than paging for more; once you have a slug, use get_book.
      parameters:
        - name: q
          in: query
          required: true
          description: The search text, at most 200 characters once surrounding whitespace is stripped.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: A page of matching books.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:

# Sidekiq-cron schedule configuration
search_indexing:
  class: Search::IndexerJob
  cron: "*/30 * * * * *"  # Every 30 seconds
  description: "Process search indexing queue"

books_author_rankings:
  class: Books::CalculateAuthorRankingsJob
  cron: "0 4 * * *"
  description: "Recalculate The Greatest Authors from ranked books"

billing_reconcile_all:
  class: Billing::ReconcileAllCustomersJob
  cron: "0 5 * * *"
  description: "Reconcile every Stripe customer against local membership rows"

user_favorites_lists:
  class: GenerateUserFavoritesListsJob
  cron: "0 3 * * *"
  description: "Rebuild each domain's generated users' favorites list"

csv_exports_refresh_global:
  class: CsvExports::RefreshGlobalJob
  cron: "30 4 * * *"
  description: "Regenerate the pre-built CSV export of every global ranking configuration"

recommendations_export_books:
  class: Recommendations::ExportInteractionsJob
  cron: "30 2 * * *"
  args: ["books"]
  description: "Export the books positive pairs for the collaborative-filtering trainer"

recommendations_load_books:
  class: Recommendations::LoadModelJob
  cron: "15 * * * *"
  args: ["books"]
  description: "Load the latest collaborative-filtering model the home server published"

workflow_recovery:
  class: WorkflowRecoveryJob
  cron: "0 * * * * *"
  description: "Redispatch lost or due workflow steps"

sessions_prune_expired:
  class: Sessions::PruneExpiredJob
  cron: "15 3 * * *"
  description: "Delete sign-in sessions past their idle timeout or hard limit"

goodreads_rebuild_enrichment:
  class: Books::GoodreadsRebuild::QueueEnrichmentJob
  cron: "*/10 * * * *"
  description: "Start enrichment for the Goodreads rebuild fixed books, most-listed first, a few hundred at a time"

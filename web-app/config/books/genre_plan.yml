# Books genre cleanup plan (docs/superpowers/specs/2026-10-17-books-genre-cleanup-design.md).
# Drafted by `bin/rails categories:genres:draft` and `map`; reviewed and edited by hand.
---
version: 1
run: genres-2026-10
genres:
- name: Absurdist
  definition: Fiction and drama built on the meaninglessness or irrationality of existence,
    often through illogical situations played straight.
- name: Adventure
  definition: Fiction driven by hazardous journeys, quests, exploration or feats of
    survival.
- name: Allegory
  definition: Works in which characters and events stand systematically for ideas,
    morals or historical events.
- name: Anthologies
  definition: Curated collections of separate works by multiple creators, also classified
    by their constituent forms.
- name: Autobiography
  definition: An author's factual account of their own life across a substantial span.
- name: Biography
  definition: A factual reconstruction of another person's life, including collective
    life histories.
- name: Comics & Graphic Novels
  definition: Works that tell stories or develop ideas through sequential images,
    usually combined with text.
- name: Coming-of-Age Fiction
  definition: Fiction structured around a protagonist's formative passage toward maturity
    and self-understanding.
- name: Contemporary Fiction
  definition: Fiction set in and engaging with the present day or recent past of its
    time.
- name: Cookbooks
  definition: Instructional works organized around recipes, food preparation and cooking
    techniques.
- name: Crime Fiction
  definition: Fiction organized around criminal acts and their execution, investigation
    or consequences.
- name: Cyberpunk
  definition: Science fiction set in high-tech, low-life futures of networks, corporations
    and altered bodies.
- name: Dark
  definition: Fiction of bleak, violent or morally disturbing vision, whatever its
    genre.
- name: Dark Humor
  definition: Comedy drawn from death, cruelty, despair or taboo subjects.
- name: Diaries & Journals
  definition: Works composed of diary or journal entries, real or fictional.
- name: Dystopian Fiction
  definition: Speculative fiction structured around life within an imagined oppressive
    or dehumanizing social order.
- name: Encyclopedic Fiction
  definition: Vast, digressive novels that try to take in a whole culture's knowledge
    (Gravity's Rainbow, Infinite Jest).
- name: Erotica
  definition: Fiction in which explicit sexual experience and erotic arousal are central
    purposes.
- name: Existentialist
  definition: Literature concerned with freedom, choice, absurdity and the individual's
    search for meaning, in the tradition of Sartre and Camus.
- name: Experimental Fiction
  definition: Fiction that breaks conventional form, language or structure as a central
    part of the work.
- name: Family Sagas
  definition: Long narratives following a family or community across generations.
- name: Fantasy
  definition: Fiction in which magic, impossible beings or supernatural worlds are
    integral to the story.
- name: Fiction
  definition: The site's book type for invented narratives, including novels and stories.
- name: Folklore & Fairy Tales
  definition: Traditional myths, legends, folktales and fairy tales, including literary
    versions using those conventions.
- name: Food Writing
  definition: Essayistic or narrative nonfiction about food, eating and cooking, distinct
    from recipe books.
- name: Gothic
  definition: Fiction using decaying settings, buried secrets and a threatening past
    to build dread and mystery.
- name: Hard Science Fiction
  definition: Science fiction that keeps closely to established science and technical
    plausibility.
- name: Hardboiled
  definition: Tough, terse crime fiction with cynical detectives and violent urban
    settings, in the tradition of Hammett and Chandler.
- name: High Fantasy
  definition: Fantasy set primarily in a fully imagined secondary world with its own
    magical order.
- name: Historical Fiction
  definition: Fiction that reconstructs a period preceding the author's own era as
    an integral part of its storytelling.
- name: Horror
  definition: Fiction designed to evoke fear or dread through threatening, uncanny
    or monstrous forces.
- name: How-To Guides
  definition: Instructional works organized around methods, procedures or steps for
    accomplishing practical tasks.
- name: Humor
  definition: Works whose primary organizing purpose is comedy, whether through narrative,
    essays or comic sketches.
- name: Inspirational Fiction
  definition: Fiction written to uplift, often centred on faith, hope or moral renewal.
- name: Letters
  definition: Correspondence, real or fictional, including epistolary novels told
    through letters.
- name: Literary Fiction
  definition: Fiction emphasizing language, characterization and artistic structure
    over established genre formulas.
- name: Magical Realism
  definition: Fiction that treats extraordinary events as ordinary within an otherwise
    recognizable reality.
- name: Manga
  definition: Sequential-art works published within the Japanese manga tradition and
    its established storytelling conventions.
- name: Memoir
  definition: A reflective firsthand account organized around selected experiences,
    relationships or periods of a life.
- name: Metafiction
  definition: Fiction that draws attention to its own fictionality, storytelling or
    the act of reading.
- name: Microhistory
  definition: Close historical study of a single person, object, event or community
    that illuminates a larger past.
- name: Modernist Literature
  definition: 'Literature of the Modernist movement (roughly 1890s to 1940s): fragmented
    form, stream of consciousness, formal experiment.'
- name: Mystery
  definition: Fiction structured around investigating and resolving a crime, puzzle
    or unexplained event.
- name: Narrative Nonfiction
  definition: Factual writing organized through scenes, characters and a sustained
    narrative arc.
- name: Nautical Fiction
  definition: Fiction centred on ships, sailors and life at sea.
- name: Noir
  definition: Bleak crime fiction of doomed protagonists, moral compromise and fatalism.
- name: Nonfiction
  definition: The site's book type for works presented as factual accounts, explanations
    or arguments.
- name: Novellas
  definition: Sustained prose fiction shorter and typically more concentrated than
    a novel.
- name: Pastoral
  definition: Works idealising rural life, landscape and the natural world.
- name: Philosophical Fiction
  definition: Fiction substantially devoted to exploring philosophical questions.
- name: Picaresque
  definition: Episodic fiction following a roguish hero through a series of adventures
    across society.
- name: Picture Books
  definition: Works in which images carry an essential share of the narrative or meaning,
    with or without text.
- name: Plays
  definition: Dramatic works written for performance through dialogue, action and
    stage directions.
- name: Poetry
  definition: The site's book type for verse and prose poems shaped by concentrated
    language, rhythm and imagery.
- name: Police Procedural
  definition: Crime fiction following the step-by-step work of police investigators.
- name: Political Fiction
  definition: Fiction in which politics, power or ideology organise the story.
- name: Popular Science
  definition: Explanatory nonfiction presenting scientific ideas and research without
    requiring specialist training.
- name: Post-Apocalyptic Fiction
  definition: Fiction set during or after the collapse of civilisation, including
    the apocalypse itself.
- name: Postmodern Literature
  definition: 'Literature of the postmodern movement: irony, pastiche, fragmentation
    and play with genre and truth.'
- name: Psychological Fiction
  definition: Fiction centred on the inner lives, motives and mental states of its
    characters.
- name: Pulp
  definition: 'Fast, sensational genre fiction in the tradition of the pulp magazines:
    adventure, sword and sorcery, planetary romance, crime.'
- name: Reference
  definition: Works organized primarily for consultation and lookup rather than continuous
    reading.
- name: Religion & Spirituality
  definition: The site's book type for sacred texts, theology, devotional works and
    spiritual teaching.
- name: Romance
  definition: Fiction centered on a developing love relationship with an emotionally
    satisfying, optimistic resolution.
- name: Romantasy
  definition: Fiction in which a central romantic arc and a fully developed fantasy
    plot are inseparable.
- name: Satire
  definition: Works structured around irony, ridicule or exaggeration to expose folly,
    vice or abuses of power.
- name: Science Fiction
  definition: Fiction extrapolating from scientific, technological or other rationally
    imagined departures from reality.
- name: Short Stories
  definition: Brief, self-contained prose fiction, published individually or in collections.
- name: Social Fiction
  definition: Fiction that portrays and examines a society, its classes and institutions
    through its characters.
- name: Space Opera
  definition: Science fiction featuring large-scale adventure, conflict and intrigue
    across interplanetary or interstellar settings.
- name: Speculative Fiction
  definition: 'Fiction built on an imagined departure from reality: the umbrella over
    fantasy, science fiction, horror and dystopia.'
- name: Spy Fiction
  definition: Fiction built around espionage operations, covert identities, intelligence
    work and divided loyalties.
- name: Steampunk
  definition: Speculative fiction set in alternate histories powered by steam-age
    technology, usually Victorian.
- name: Supernatural Fiction
  definition: Fiction in which ghosts, spirits or other supernatural forces play a
    central part, not always to frighten.
- name: Surreal
  definition: Fiction with dreamlike, irrational imagery and logic, in the tradition
    of Surrealism.
- name: Textbooks
  definition: Works designed for systematic instruction through sequenced explanations,
    examples and often exercises.
- name: Thriller & Suspense
  definition: Fiction driven by escalating danger, uncertainty and anticipation of
    consequential outcomes.
- name: Tragedy
  definition: Works tracing a protagonist's downfall through fate, flaw or circumstance.
- name: Travel Writing
  definition: Firsthand nonfiction journey narratives shaped by encounters, observation
    and reflection.
- name: True Crime
  definition: Documentary or narrative accounts reconstructing actual crimes, investigations
    and their consequences.
- name: War & Military Fiction
  definition: Fiction centred on war, combat and military life.
- name: Weird Fiction
  definition: Fiction of the strange and unknowable, from Poe and Machen through Lovecraft
    to the New Weird.
- name: Westerns
  definition: Fiction using frontier conventions such as contested law, settlement,
    outlaws and personal justice.
audiences:
- name: Children's
  definition: Written for readers up to about age 8.
- name: Middle Grade
  definition: Written for readers about 8 to 12.
- name: Young Adult
  definition: Written for readers about 12 to 18.

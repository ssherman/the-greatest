<!doctype html>
<!-- Static on purpose: served for errors the app could not render through its
     own layout (and as the 404 fallback). No external assets -- this has to
     work when the app, the asset build or the CDN is the thing that failed.
     Shared by every site, so it names none of them. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>We couldn&rsquo;t complete that request (422 Request rejected)</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f6f3;
      --card: #ffffff;
      --text: #1f1d1a;
      --muted: #5f5a52;
      --border: #e4e1da;
      --button: #1f1d1a;
      --button-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16151a;
        --card: #1f1e24;
        --text: #f2f0eb;
        --muted: #b3aea5;
        --border: #34323a;
        --button: #f2f0eb;
        --button-text: #16151a;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    main {
      width: 100%;
      max-width: 32rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 28px;
      text-align: center;
    }
    .code {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 { margin: 8px 0 0; font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.2; }
    p.message { margin: 16px 0 0; color: var(--muted); }
    a.button {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 20px;
      border-radius: 8px;
      background: var(--button);
      color: var(--button-text);
      font-weight: 600;
      text-decoration: none;
    }
    a.button:hover, a.button:focus-visible { opacity: 0.85; }
    a.button:focus-visible { outline: 2px solid var(--muted); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 422</p>
    <h1>We couldn&rsquo;t complete that request</h1>
    <p class="message">The page may have been open for too long. Go back, reload the page, and try again.</p>
    <a class="button" href="/">Go to the home page</a>
  </main>
</body>
</html>

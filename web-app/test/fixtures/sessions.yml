regular_user_session:
  user: regular_user
  user_agent: Mozilla/5.0
  ip_address: 127.0.0.1
  last_active_at: <%= 1.hour.ago.to_fs(:db) %>
  created_at: <%= 2.days.ago.to_fs(:db) %>
  updated_at: <%= 1.hour.ago.to_fs(:db) %>

stale_session:
  user: admin_user
  user_agent: Mozilla/5.0
  ip_address: 127.0.0.1
  last_active_at: <%= 120.days.ago.to_fs(:db) %>
  created_at: <%= 130.days.ago.to_fs(:db) %>
  updated_at: <%= 120.days.ago.to_fs(:db) %>

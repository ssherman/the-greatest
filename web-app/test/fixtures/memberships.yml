# Semantic names, matching the users.yml convention.
# == Schema Information
#
# Table name: memberships
#
#  id                     :bigint           not null, primary key
#  cancel_at_period_end   :boolean          default(FALSE), not null
#  canceled_at            :datetime
#  current_period_end     :datetime
#  ended_email_sent_at    :datetime
#  interval               :integer
#  note                   :text
#  origin_domain          :string
#  source                 :integer          default(0), not null
#  status                 :integer          not null
#  stripe_synced_at       :datetime
#  welcome_email_sent_at  :datetime
#  created_at             :datetime         not null
#  updated_at             :datetime         not null
#  granted_by_id          :bigint
#  stripe_customer_id     :string
#  stripe_subscription_id :string
#  user_id                :bigint
#
# Indexes
#
#  index_memberships_on_granted_by_id               (granted_by_id)
#  index_memberships_on_stripe_customer_id          (stripe_customer_id)
#  index_memberships_on_stripe_subscription_id      (stripe_subscription_id) UNIQUE WHERE (stripe_subscription_id IS NOT NULL)
#  index_memberships_on_user_id                     (user_id)
#  index_memberships_on_user_id_and_status          (user_id,status)
#  index_memberships_one_grant_per_user_per_source  (user_id,source) UNIQUE WHERE ((source <> 0) AND (user_id IS NOT NULL))
#
# Foreign Keys
#
#  fk_rails_...  (granted_by_id => users.id)
#  fk_rails_...  (user_id => users.id)
#
regular_user_monthly:
  user: regular_user
  source: 0          # stripe
  status: 1          # active
  interval: 0        # monthly
  stripe_subscription_id: sub_regular_monthly
  stripe_customer_id: cus_regular
  current_period_end: <%= 20.days.from_now.to_fs(:db) %>
  cancel_at_period_end: false
  origin_domain: books
  stripe_synced_at: <%= 1.hour.ago.to_fs(:db) %>

google_user_canceled_in_grace:
  user: google_user
  source: 0          # stripe
  status: 2          # canceled
  interval: 1        # yearly
  stripe_subscription_id: sub_google_yearly
  stripe_customer_id: cus_google
  current_period_end: <%= 10.days.from_now.to_fs(:db) %>
  canceled_at: <%= 2.days.ago.to_fs(:db) %>
  cancel_at_period_end: true
  origin_domain: music

editor_user_comped:
  user: editor_user
  source: 1          # comped
  status: 1          # active
  current_period_end:   # nil — never expires
  note: Contributor comp
  granted_by: admin_user

password_user_legacy:
  user: password_user
  source: 2          # legacy
  status: 1          # active
  current_period_end:   # nil — legacy early supporters never expire
  note: Legacy early supporter

regular_user_past_due:
  user: admin_user
  source: 0          # stripe
  status: 5          # past_due
  interval: 0        # monthly
  stripe_subscription_id: sub_admin_past_due
  stripe_customer_id: cus_admin
  current_period_end: <%= 20.days.from_now.to_fs(:db) %>
  origin_domain: books

canceled_and_expired:
  user: user_with_expired_membership
  source: 0          # stripe
  status: 2          # canceled
  interval: 0        # monthly
  stripe_subscription_id: sub_expired_grace
  stripe_customer_id: cus_expired
  current_period_end: <%= 3.days.ago.to_fs(:db) %>
  canceled_at: <%= 35.days.ago.to_fs(:db) %>
  cancel_at_period_end: true
  origin_domain: books

comped_expired:
  user: user_with_expired_comp
  source: 1          # comped
  status: 1          # active
  current_period_end: <%= 1.day.ago.to_fs(:db) %>
  note: Expired conference comp
  granted_by: admin_user

unattached_active:
  user:              # nil — an unmappable Stripe customer, stored not dropped
  source: 0          # stripe
  status: 1          # active
  interval: 1        # yearly
  stripe_subscription_id: sub_unattached
  stripe_customer_id: cus_unattached
  current_period_end: <%= 200.days.from_now.to_fs(:db) %>

# Canceled outright (not scheduled-to-cancel), but our copy of the paid-through
# date is still in the future -- exercises the branch of
# MembershipHelper#membership_status_sentence that checks `canceled?` without
# `cancel_at_period_end?`, distinct from google_user_canceled_in_grace above.
canceled_no_grace_flag:
  user: user_with_unflagged_cancellation
  source: 0          # stripe
  status: 2          # canceled
  interval: 0        # monthly
  stripe_subscription_id: sub_unflagged_cancel
  stripe_customer_id: cus_unflagged_cancel
  current_period_end: <%= 15.days.from_now.to_fs(:db) %>
  cancel_at_period_end: false
  origin_domain: books

# A comp with a set (future) expiry -- exercises the non-stripe,
# not-yet-expired branch of MembershipHelper#membership_status_sentence,
# distinct from editor_user_comped (never expires) and comped_expired (past).
comped_with_future_end:
  user: user_with_dated_comp
  source: 1          # comped
  status: 1          # active
  current_period_end: <%= 30.days.from_now.to_fs(:db) %>
  note: Time-limited comp
  granted_by: admin_user

# Same shape as canceled_no_grace_flag, but past its paid-through date --
# exercises the past-dated half of the `canceled?` (not `cancel_at_period_end?`)
# branch of MembershipHelper#membership_status_sentence.
canceled_no_grace_flag_and_expired:
  user: user_with_stale_cancellation
  source: 0          # stripe
  status: 2          # canceled
  interval: 0        # monthly
  stripe_subscription_id: sub_unflagged_cancel_expired
  stripe_customer_id: cus_unflagged_cancel_expired
  current_period_end: <%= 5.days.ago.to_fs(:db) %>
  cancel_at_period_end: false
  origin_domain: books

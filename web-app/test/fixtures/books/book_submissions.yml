queued_goodreads:
  user: regular_user
  input_method: <%= Books::BookSubmission.input_methods[:goodreads] %>
  raw_input: https://www.goodreads.com/book/show/5107.The_Catcher_in_the_Rye
  goodreads_book_id: 5107
  status: <%= Books::BookSubmission.statuses[:queued] %>

added_title_authors:
  user: regular_user
  input_method: <%= Books::BookSubmission.input_methods[:title_authors] %>
  typed_title: A Book Nobody Had
  typed_author_names: ["Some Author"]
  status: <%= Books::BookSubmission.statuses[:added] %>
  review_status: <%= Books::BookSubmission.review_statuses[:pending] %>
  created_book: true

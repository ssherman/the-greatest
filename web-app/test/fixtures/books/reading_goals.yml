# == Schema Information
#
# Table name: books_reading_goals
#
#  id           :bigint           not null, primary key
#  description  :text
#  ends_on      :date             not null
#  name         :string           not null
#  public       :boolean          default(FALSE), not null
#  starts_on    :date             not null
#  target_count :integer          not null
#  created_at   :datetime         not null
#  updated_at   :datetime         not null
#  user_id      :bigint           not null
#
# Indexes
#
#  index_books_reading_goals_for_public_date_lookup  (user_id,public,starts_on,ends_on)
#  index_books_reading_goals_on_user_id              (user_id)
#
# Foreign Keys
#
#  fk_rails_...  (user_id => users.id)
#
# Dates are RELATIVE to Date.current, deliberately.
#
# They were absolute until 2026-09-01, when two goals whose ends_on was
# 2026-08-31 rolled from active into finished at UTC midnight and broke
# Books::My::ReadingGoalsControllerTest. The fixture names had already drifted
# from what the dates meant -- active_ending_soon had been sitting in the
# finished group -- and the test had been written to match the drift.
#
# Keep them relative. An absolute date here is a time bomb with no owner.
active_ending_soon:
  id: 1
  user: regular_user
  name: Finish Summer Reading
  target_count: 5
  starts_on: <%= Date.current - 30.days %>
  ends_on: <%= Date.current + 3.days %>
  public: false

active_ending_later:
  id: 2
  user: regular_user
  name: August Classics
  target_count: 3
  starts_on: <%= Date.current - 20.days %>
  ends_on: <%= Date.current + 30.days %>
  public: false

